# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user  root;
worker_processes auto;
worker_rlimit_nofile 65535;  # 增加文件描述符限制，解决高并发连接问题
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 4096;  # 从1024增加到4096，支持更多并发连接
    use epoll;                # 使用epoll事件模型，提高性能
    multi_accept on;          # 允许多个连接同时建立
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Rate limiting configuration - TEMPORARILY DISABLED FOR LOAD TESTING
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    # limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    # limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    include /etc/nginx/conf.d/*.conf;

    # ============================================
    # 【gevent优化】Upstream 配置 - 保持与后端长连接
    # ============================================
    upstream django_backend {
        server 127.0.0.1:9001;
        keepalive 100;  # 保持100个空闲长连接
    }

    # ============================================
    # 【6.2】上传专用 API Upstream - 隔离上传落盘 I/O
    # 依据: 《资料库并发上传与状态机修复方案》6.2
    # 职责: 专门处理文件上传/分片/合并接口，避免阻塞普通 API
    # 端口: 9003 (9001=普通API, 9002=WebSocket, 9003=上传API)
    # ============================================
    upstream upload_backend {
        server 127.0.0.1:9003;
        keepalive 32;  # 上传连接数相对少，32 足够
    }

    # ============================================
    # kkFileView 预览服务 - Docker 内置 DNS 解析器
    # 使用变量方式代理，避免 kkfileview 容器未启动时 Nginx 无法启动
    # ============================================
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Development HTTP server
    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  localhost;

        root         /data/spug/spug_web/build;
        client_max_body_size 0;
        add_header   X-Frame-Options SAMEORIGIN always;
        add_header   X-Content-Type-Options nosniff always;

        gzip  on;
        gzip_min_length  1k;
        gzip_buffers     4 16k;
        gzip_http_version 1.1;
        gzip_comp_level 7;
        gzip_types       text/plain text/css text/javascript application/javascript application/json;
        gzip_disable "MSIE [1-6]\.";
        gzip_vary on;

        # ============================================
        # 【6.2】上传 API 专用代理 - 转发到 upload_backend (9003)
        # 依据: 《资料库并发上传与状态机修复方案》6.2
        # 原因: 大文件分片落盘是阻塞 I/O，与普通 API 共享 worker 时互相影响
        # 注意: nginx 按最长前缀匹配，这些 location 比 /api/ 更具体，会优先命中
        # 回滚: 注释掉这 5 个 location 块即可恢复全部走 django_backend
        # ============================================
        location ^~ /api/document/upload/ {
            rewrite ^/api(.*) $1 break;
            proxy_pass http://upload_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
            proxy_redirect off;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        location ^~ /api/document/upload_chunk/ {
            client_max_body_size 0;  # 分片大小不受 nginx 限制
            rewrite ^/api(.*) $1 break;
            proxy_pass http://upload_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
            proxy_redirect off;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        location ^~ /api/document/check_uploaded_chunks/ {
            rewrite ^/api(.*) $1 break;
            proxy_pass http://upload_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_redirect off;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        location ^~ /api/document/merge_chunks/ {
            rewrite ^/api(.*) $1 break;
            proxy_pass http://upload_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 600s;  # 合并请求可能触发 Celery，给足超时
            proxy_redirect off;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        location ^~ /api/document/merge_status/ {
            rewrite ^/api(.*) $1 break;
            proxy_pass http://upload_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_redirect off;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        # HTTP API proxy
        location ^~ /api/ {
            # Rate limiting for API endpoints (strict) - TEMPORARILY DISABLED
            # limit_req zone=api_limit burst=100 nodelay;

            rewrite ^/api(.*) $1 break;
            proxy_pass http://django_backend;   # 【优化】使用 upstream 保持长连接
            proxy_http_version 1.1;              # 【优化】HTTP/1.1 支持 keepalive
            proxy_set_header Connection "";      # 【优化】允许连接复用
            proxy_set_header Host $host;         # 【修复】显式设置 Host 头
            proxy_read_timeout 300s;             # 【优化】与 Gunicorn timeout 一致
            proxy_redirect off;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        # WebSocket proxy
        location ^~ /api/ws/ {
            rewrite ^/api(.*) $1 break;
            proxy_pass http://127.0.0.1:9002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        # ============================================
        # kkFileView Office文档预览服务代理
        # 前端通过 /kkfileview/ 路径访问kkFileView
        # 使用变量方式，Nginx启动时不解析主机名，请求时动态解析
        # KK_CONTEXT_PATH=/kkfileview，路径1:1映射，无需重写
        # proxy_redirect 修正kkFileView内部重定向URL
        # ============================================
        location ^~ /kkfileview/ {
            set $kkfileview_upstream http://kkfileview:8012;
            proxy_pass $kkfileview_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_read_timeout 300s;       # Office转换可能较慢
            proxy_send_timeout 300s;
            client_max_body_size 100m;     # kkFileView下载文件大小限制
            # 允许kkFileView的iframe在spug页面中嵌入
            add_header X-Frame-Options SAMEORIGIN always;
            # 替换kkFileView HTML中的硬编码绝对URL为相对路径
            # KK_BASE_URL生成的 http://localhost/kkfileview 会被替换为 /kkfileview
            # 这样不管用户通过localhost、127.0.0.1还是IP访问都能正常预览
            sub_filter 'http://localhost/kkfileview' '/kkfileview';
            sub_filter_once off;
            sub_filter_types application/javascript;
        }

        # Static files (SPA 前端路由支持)
        location / {
            # Rate limiting for general requests (relaxed) - TEMPORARILY DISABLED
            # limit_req zone=general_limit burst=100 nodelay;

            try_files $uri $uri/ /index.html;  # 修正：添加 $uri/ 避免重定向循环
        }

        # Media files for uploaded images
        location /media/ {
            alias /data/spug/spug_api/media/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Special rate limiting for login endpoint - TEMPORARILY DISABLED
        location = /api/account/login/ {
            # Strict rate limiting for login (prevent brute force) - TEMPORARILY DISABLED
            # limit_req zone=login_limit burst=3 nodelay;

            rewrite ^/api(.*) $1 break;
            proxy_pass http://django_backend;   # 【优化】使用 upstream 保持长连接
            proxy_http_version 1.1;              # 【优化】HTTP/1.1 支持 keepalive
            proxy_set_header Connection "";      # 【优化】允许连接复用
            proxy_set_header Host $host;         # 【修复】显式设置 Host 头
            proxy_read_timeout 300s;             # 【优化】与 Gunicorn timeout 一致
            proxy_redirect off;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }
    }
}
