# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/
# 注：所有 X-Forwarded-For 统一用 $remote_addr 覆盖（而非 $proxy_add_x_forwarded_for 追加）。
# 本 nginx 是唯一可信代理入口，客户端伪造的 XFF 链前段必须丢弃，防止伪造来源 IP。

user  root;
worker_processes auto;
worker_rlimit_nofile 65535;  # 增加文件描述符限制，解决高并发连接问题
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 4096;  # 从1024增加到4096，支持更多并发连接
    use epoll;                # 使用epoll事件模型，提高性能
    multi_accept on;          # 允许多个连接同时建立
}

http {
    map $uri $run_metric_category {
        default "api";
        ~^/api/ws/ "websocket";
        ~^/api/document/(upload|upload_chunk|merge_chunks|direct_merge|download|preview) "transfer";
        =/api/document/health/ "health";
    }
    log_format run_metrics escape=json '{"timestamp":"$time_iso8601","request_id":"$request_id","method":"$request_method","uri":"$uri","status":$status,"upstream_status":"$upstream_status","request_time":$request_time,"upstream_response_time":"$upstream_response_time","bytes":$body_bytes_sent,"category":"$run_metric_category"}';
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    access_log  /var/log/nginx/run_metrics.log  run_metrics;

    # Rate limiting configuration - TEMPORARILY DISABLED FOR LOAD TESTING
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    # limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    # limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   120;
    client_body_timeout 600s;
    send_timeout        600s;
    types_hash_max_size 2048;
    server_tokens       off;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    include /etc/nginx/conf.d/*.conf;

    # ============================================
    # 【gevent优化】Upstream 配置 - 保持与后端长连接
    # ============================================
    upstream django_backend {
        server 127.0.0.1:9001;
        keepalive 100;  # 保持100个空闲长连接
    }

    # ============================================
    # 【6.2】上传专用 API Upstream - 隔离上传落盘 I/O
    # 依据: 《资料库并发上传与状态机修复方案》6.2
    # 职责: 专门处理文件上传/分片/合并接口，避免阻塞普通 API
    # 端口: 9003 (9001=普通API, 9002=WebSocket, 9003=上传API)
    # ============================================
    upstream upload_backend {
        server 127.0.0.1:9003;
        keepalive 128;  # higher upload connection reuse limit
    }

    # ============================================
    # kkFileView 预览服务 - Docker 内置 DNS 解析器
    # 使用变量方式代理，避免 kkfileview 容器未启动时 Nginx 无法启动
    # ============================================
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ONLYOFFICE 协同编辑 WebSocket：带 Upgrade 头的请求走 upgrade 连接，
    # 普通请求传空 Connection 以复用长连接
    map $http_upgrade $connection_upgrade_onlyoffice {
        default upgrade;
        ''      '';
    }

    # Development HTTP server
    # 额外监听容器内 8080/3001：DS 按 X-Forwarded-Host（$http_host/onlyoffice，
    # 动态跟随浏览器来源）生成缓存文件 URL，如 http://localhost:3001/onlyoffice/
    # cache/...。浏览器侧经宿主机同源访问；spug 容器回源该 URL 时命中本机
    # 对应端口的监听再转 DS。这些端口不发布到宿主机，仅容器内。
    server {
        listen       80 default_server;
        listen       8080 default_server;
        listen       3000 default_server;  # CRA dev server (npm start) 缓存 URL 回源
        listen       3001 default_server;
        listen       [::]:80 default_server;
        server_name  localhost;

        root         /data/spug/spug_web/build;
        client_max_body_size 0;
        add_header   X-Frame-Options SAMEORIGIN always;
        add_header   X-Content-Type-Options nosniff always;

        gzip  on;
        gzip_min_length  1k;
        gzip_buffers     4 16k;
        gzip_http_version 1.1;
        gzip_comp_level 7;
        gzip_types       text/plain text/css text/javascript application/javascript application/json;
        gzip_disable "MSIE [1-6]\.";
        gzip_vary on;

        # ============================================
        # 【6.2】上传 API 专用代理 - 转发到 upload_backend (9003)
        # 依据: 《资料库并发上传与状态机修复方案》6.2
        # 原因: 大文件分片落盘是阻塞 I/O，与普通 API 共享 worker 时互相影响
        # 注意: nginx 按最长前缀匹配，这些 location 比 /api/ 更具体，会优先命中
        # 回滚: 注释掉这 6 个 location 块即可恢复全部走 django_backend
        # ============================================
        location ^~ /api/document/upload/ {
            rewrite ^/api(.*) $1 break;
            proxy_pass http://upload_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 1200s;
            proxy_send_timeout 1200s;
            proxy_redirect off;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }

        location ^~ /api/document/upload_chunk/ {
            client_max_body_size 0;  # 分片大小不受 nginx 限制
            rewrite ^/api(.*) $1 break;
            proxy_pass http://upload_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 1200s;
            proxy_send_timeout 1200s;
            proxy_redirect off;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }

        location ^~ /api/document/check_uploaded_chunks/ {
            rewrite ^/api(.*) $1 break;
            proxy_pass http://upload_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_redirect off;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }

        location ^~ /api/document/merge_chunks/ {
            rewrite ^/api(.*) $1 break;
            proxy_pass http://upload_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 1200s;
            proxy_send_timeout 1200s;  # 合并请求可能触发 Celery，给足超时
            proxy_redirect off;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }

        location ^~ /api/document/merge_status/ {
            rewrite ^/api(.*) $1 break;
            proxy_pass http://upload_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_redirect off;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }

        location ^~ /api/document/direct_merge/ {
            rewrite ^/api(.*) $1 break;
            proxy_pass http://upload_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 1200s;
            proxy_send_timeout 1200s;  # 直接合并触发 Celery，给足超时
            proxy_redirect off;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }

        # HTTP API proxy
        location ^~ /api/ {
            # Rate limiting for API endpoints (strict) - TEMPORARILY DISABLED
            # limit_req zone=api_limit burst=100 nodelay;

            rewrite ^/api(.*) $1 break;
            proxy_pass http://django_backend;   # 【优化】使用 upstream 保持长连接
            proxy_http_version 1.1;              # 【优化】HTTP/1.1 支持 keepalive
            proxy_set_header Connection "";      # 【优化】允许连接复用
            proxy_set_header Host $host;         # 【修复】显式设置 Host 头
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;             # 【优化】与 Gunicorn timeout 一致
            proxy_redirect off;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }

        # WebSocket proxy
        location ^~ /api/ws/ {
            rewrite ^/api(.*) $1 break;
            proxy_pass http://127.0.0.1:9002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }

        # ============================================
        # kkFileView Office文档预览服务代理
        # 前端通过 /kkfileview/ 路径访问kkFileView
        # 使用变量方式，Nginx启动时不解析主机名，请求时动态解析
        # KK_CONTEXT_PATH=/kkfileview，路径1:1映射，无需重写
        # proxy_redirect 修正kkFileView内部重定向URL
        # ============================================
        location ^~ /kkfileview/ {
            set $kkfileview_upstream http://kkfileview:8012;
            proxy_pass $kkfileview_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_read_timeout 600s;       # Office转换可能较慢
            proxy_send_timeout 300s;
            client_max_body_size 100m;     # kkFileView下载文件大小限制
            # 允许kkFileView的iframe在spug页面中嵌入
            add_header X-Frame-Options SAMEORIGIN always;
            # 替换kkFileView HTML中的硬编码绝对URL为相对路径
            # KK_BASE_URL生成的 http://localhost/kkfileview 会被替换为 /kkfileview
            # 这样不管用户通过localhost、127.0.0.1还是IP访问都能正常预览
            sub_filter 'http://localhost/kkfileview' '/kkfileview';
            sub_filter_once off;
            sub_filter_types application/javascript;
        }

        # ============================================
        # ONLYOFFICE Docs 文档服务代理（制度管理在线编辑，2026-10-28）
        # 与 kkfileview 同思路：变量式 upstream，Nginx 启动时不解析主机名，
        # onlyoffice 容器暂时未运行也不影响 Nginx 启动。
        # 子路径代理：rewrite 剥离 /onlyoffice 前缀后转发到 DS 内置 Nginx。
        # X-Forwarded-Host 固定为 tdyw-test/onlyoffice：DS 据此生成回调
        # 文件与缓存 URL（http://tdyw-test/onlyoffice/cache/...），该地址
        # 在 Compose 网络内经 tdyw-test 自身 Nginx 回到 DS，容器间可达；
        # 与 spug 的 ONLYOFFICE_PUBLIC_BASE_URL=http://tdyw-test 同一事实来源。
        # ============================================
        location ^~ /onlyoffice/ {
            # set 必须在 rewrite break 之前：break 会终止 rewrite 阶段，
            # 之后的 set 不再执行，变量为空会使 proxy_pass 直接 500
            set $onlyoffice_upstream http://onlyoffice:80;
            rewrite ^/onlyoffice(/.*)$ $1 break;
            proxy_pass $onlyoffice_upstream;
            # DS 依据 X-Forwarded-Host 生成绝对重定向（如版本化静态资源
            # 302 到 http://<来源>/onlyoffice/8.1.3-4/...）。把该前缀的重
            # 定向改写回本站 /onlyoffice/ 相对路径，避免缓存住旧绝对地址；
            # DS 服务端生成的回调/缓存 URL 不受影响。
            proxy_redirect http://$http_host/onlyoffice/ /onlyoffice/;
            # 改写后的 Location 保持相对路径（absolute 时 $host 不含端口，
            # 会把浏览器导到 80 端口），相对路径由浏览器按当前源解析
            absolute_redirect off;
            proxy_http_version 1.1;
            # 协同编辑为 WebSocket 长连接；普通请求 Connection 为空
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade_onlyoffice;
            proxy_set_header Host $host;
            # X-Forwarded-Host 动态取请求 Host（含端口）：DS 据此生成编辑器
            # 取缓存文件与回调文件 URL（http://<浏览器来源>/onlyoffice/cache/
            # ...），使缓存 URL 与浏览器同源、spug 容器回源时命中本机对应
            # 端口监听再转 DS（见 server 块注释）。经 3000/3001 dev server
            # 代理时需 setupProxy 对应块 changeOrigin:false 透传 Host。
            proxy_set_header X-Forwarded-Host $http_host/onlyoffice;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;      # 协同编辑 WebSocket 长连接
        proxy_send_timeout 360s;
        client_max_body_size 100m;     # 编辑器本地文档上传
        }

        # ============================================
        # ONLYOFFICE 新版对照测试实例代理（2026-10-28 显示保真对照）
        # 指向隔离实例 tdyw-onlyoffice-next（dev/docker-compose.onlyoffice-next.yml，
        # 项目 oo-next，独立卷）；8.1 实例的 /onlyoffice/ 块保持不动。
        # spug 后端经 ONLYOFFICE_DOCS_URL=/onlyoffice-next 切换到本实例做
        # 新版显示保真对照；对照结束后该环境变量移除即恢复 8.1。
        # ============================================
        location ^~ /onlyoffice-next/ {
            set $onlyoffice_next_upstream http://onlyoffice-next:80;
            rewrite ^/onlyoffice-next(/.*)$ $1 break;
            proxy_pass $onlyoffice_next_upstream;
            proxy_redirect http://$http_host/onlyoffice-next/ /onlyoffice-next/;
            absolute_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade_onlyoffice;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $http_host/onlyoffice-next;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 360s;
            client_max_body_size 100m;
        }

        # Static files (SPA 前端路由支持)
        location / {
            # Rate limiting for general requests (relaxed) - TEMPORARILY DISABLED
            # limit_req zone=general_limit burst=100 nodelay;

            try_files $uri $uri/ /index.html;  # 修正：添加 $uri/ 避免重定向循环
        }

        # Media files for uploaded images
        location /media/ {
            alias /data/spug/spug_api/media/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Special rate limiting for login endpoint - TEMPORARILY DISABLED
        location = /api/account/login/ {
            # Strict rate limiting for login (prevent brute force) - TEMPORARILY DISABLED
            # limit_req zone=login_limit burst=3 nodelay;

            rewrite ^/api(.*) $1 break;
            proxy_pass http://django_backend;   # 【优化】使用 upstream 保持长连接
            proxy_http_version 1.1;              # 【优化】HTTP/1.1 支持 keepalive
            proxy_set_header Connection "";      # 【优化】允许连接复用
            proxy_set_header Host $host;         # 【修复】显式设置 Host 头
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;             # 【优化】与 Gunicorn timeout 一致
            proxy_redirect off;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }
    }
}
