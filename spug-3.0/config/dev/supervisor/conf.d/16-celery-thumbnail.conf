; ========================================
; Celery Worker: 缩略图任务队列 (document.thumbnail)
; 职责: 资料库图片缩略图异步生成（Pillow 解码）
; 依据: 《资料库上传性能优化建议》第 4 项 - 缩略图生成改异步
; 说明:
;   - 只监听 document.thumbnail，避免 Pillow 吃 CPU 拖慢上传 API 和合并 worker
;   - 并发默认 1，可通过环境变量 CELERY_THUMBNAIL_CONCURRENCY 覆盖
;   - --prefetch-multiplier=1 避免单个大图任务被预取后阻塞其他缩略图任务
;   - --max-tasks-per-child=100 防止 Pillow 内存泄漏长期累积
;   - 改用 start-celery-thumbnail.sh 脚本，与 docker/生产环境保持一致并支持环境变量覆盖
; ========================================

[program:spug-celery-thumbnail]
command = bash /data/spug/spug_api/tools/start-celery-thumbnail.sh
directory = /data/spug/spug_api
autostart = true
autorestart = true
stdout_logfile = /data/spug/spug_api/logs/celery_thumbnail.log
stderr_logfile = /data/spug/spug_api/logs/celery_thumbnail_error.log
environment = DJANGO_SETTINGS_MODULE="spug.settings",PYTHONPATH="/data/spug/spug_api",CELERY_THUMBNAIL_CONCURRENCY="1"
priority=48
