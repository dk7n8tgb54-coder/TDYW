; ========================================
; Celery Worker: 批量操作队列 (document.batch)
; 职责: 批量删除、批量取消等批量操作
; 修正: v4队列隔离，避免阻塞核心业务
; ========================================

[program:spug-celery-batch]
command = celery -A spug worker -l info -Q document.batch -n batch-worker@%%h -c 2 --prefetch-multiplier=1 --max-tasks-per-child=500
directory = /data/spug/spug_api
autostart = true
autorestart = true
stdout_logfile = /data/spug/spug_api/logs/celery_batch.log
stderr_logfile = /data/spug/spug_api/logs/celery_batch_error.log
environment = DJANGO_SETTINGS_MODULE="spug.settings",PYTHONPATH="/data/spug/spug_api"
priority=35
