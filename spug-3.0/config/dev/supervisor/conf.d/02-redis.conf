; ========================================
; Redis 缓存服务
; ========================================

[program:redis]
; 【2026-06-08 修复】改用命令行参数而非 /etc/redis/redis.conf
; 原因：默认 redis.conf 中 daemonize=yes，redis 启动后 fork 子进程并立即 exit 0
;       supervisor 看到 exit status 0（not expected）→ FATAL → gave up
;       业务一直靠残留的孤儿 redis 进程兜底，supervisor 完全管不住
;       与 docker/config/supervisord.conf 第 21 行保持一致
command = redis-server --daemonize no --bind 127.0.0.1 --port 6379
autostart = true
autorestart = true
priority=15
