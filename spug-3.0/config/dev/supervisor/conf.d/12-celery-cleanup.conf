; ========================================
; Celery Worker: 清理任务队列 (document.cleanup)
; 职责: 过期文件清理、临时文件清理等低优先级任务
; ========================================

[program:spug-celery-cleanup]
command = celery -A spug worker -l info -Q document.cleanup -n cleanup-worker@%%h -c 1 --prefetch-multiplier=1 --max-tasks-per-child=1000
directory = /data/spug/spug_api
autostart = true
autorestart = true
stdout_logfile = /data/spug/spug_api/logs/celery_cleanup.log
stderr_logfile = /data/spug/spug_api/logs/celery_cleanup_error.log
environment = DJANGO_SETTINGS_MODULE="spug.settings",PYTHONPATH="/data/spug/spug_api"
priority=37
