; ========================================
; Celery Worker: 清理任务队列 (document.cleanup)
; 职责: 上传链路清理专用（旧分片/过期传输记录/孤儿传输记录/卡住 merging/物理文件待清理重试）
; 说明:
;   - 只监听 document.cleanup，不再作为回收站删除兜底队列
;   - 并发默认 1，可通过环境变量 CELERY_CLEANUP_CONCURRENCY 覆盖
;   - 保留 --prefetch-multiplier=1
;   - 改用 start-celery-cleanup.sh 脚本，与 docker/生产环境保持一致并支持环境变量覆盖
; ========================================

[program:spug-celery-cleanup]
command = bash /data/spug/spug_api/tools/start-celery-cleanup.sh
directory = /data/spug/spug_api
autostart = true
autorestart = true
stdout_logfile = /data/spug/spug_api/logs/celery_cleanup.log
stderr_logfile = /data/spug/spug_api/logs/celery_cleanup_error.log
environment = DJANGO_SETTINGS_MODULE="spug.settings",PYTHONPATH="/data/spug/spug_api",CELERY_CLEANUP_CONCURRENCY="1"
priority=37
