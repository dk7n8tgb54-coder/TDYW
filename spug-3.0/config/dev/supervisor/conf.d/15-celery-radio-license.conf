; ========================================
; Celery Worker: 无线电执照队列 (radio_license)
; 职责: 执照到期扫描、提醒生成等定时任务
; ========================================

[program:spug-celery-radio-license]
command = celery -A spug worker -l info -Q radio_license -n radio-license-worker@%%h -c 1 --prefetch-multiplier=1 --max-tasks-per-child=100
directory = /data/spug/spug_api
autostart = true
autorestart = true
stdout_logfile = /data/spug/spug_api/logs/celery_radio_license.log
stderr_logfile = /data/spug/spug_api/logs/celery_radio_license_error.log
environment = DJANGO_SETTINGS_MODULE="spug.settings",PYTHONPATH="/data/spug/spug_api"
priority=36
