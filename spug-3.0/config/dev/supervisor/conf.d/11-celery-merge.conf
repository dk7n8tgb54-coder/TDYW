; ========================================
; Celery Worker: 合并任务队列 (document.merge)
; 职责: 文件分片合并任务（专用 merge worker）
; 依据: 《资料库并发上传与状态机修复方案》5.3 拆分 Celery merge worker
; 说明:
;   - 只监听 document.merge，不监听其他队列
;   - 并发默认 2（适合 8G 内存、普通 SSD/机械盘服务器），可通过环境变量 CELERY_MERGE_CONCURRENCY 覆盖
;   - 生产建议: 小型服务器(8G)用 1-2，高性能服务器(NVMe/16G+)可用 3-4
;   - 保留 --prefetch-multiplier=1，避免大文件合并任务被预取后阻塞其他任务
;   - 改用 start-celery-merge.sh 脚本，与生产环境保持一致并支持环境变量覆盖
; ========================================

[program:spug-celery-merge]
command = bash /data/spug/spug_api/tools/start-celery-merge.sh
directory = /data/spug/spug_api
autostart = true
autorestart = true
stdout_logfile = /data/spug/spug_api/logs/celery_merge.log
stderr_logfile = /data/spug/spug_api/logs/celery_merge_error.log
environment = DJANGO_SETTINGS_MODULE="spug.settings",PYTHONPATH="/data/spug/spug_api",CELERY_MERGE_CONCURRENCY="2"
priority=36
