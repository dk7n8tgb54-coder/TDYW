; ========================================
; Spug WebSocket服务
; ========================================

[program:spug-ws]
command = bash /data/spug/spug_api/tools/start-ws.sh
directory = /data/spug/spug_api
autostart = true
autorestart = true
stdout_logfile = /data/spug/spug_api/logs/ws.log
stderr_logfile = /data/spug/spug_api/logs/ws_err.log
redirect_stderr = false
environment = DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=25
