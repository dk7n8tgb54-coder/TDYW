; ========================================
; Celery Beat: 定时任务调度器
; ========================================

[program:spug-celery-beat]
command = bash /data/spug/spug_api/tools/start-celery-beat.sh
directory = /data/spug/spug_api
autostart = true
autorestart = true
stdout_logfile = /data/spug/spug_api/logs/celery-beat.log
stderr_logfile = /data/spug/spug_api/logs/celery-beat_err.log
redirect_stderr = false
environment = DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=40
