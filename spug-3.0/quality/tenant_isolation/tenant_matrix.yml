# 租户隔离模型矩阵
# 分类: tenant_private(租户私有), global(全局共享), pending(待业务确认)

modules:
  home:
    models:
      - name: Navigation
        table: home_navigation
        tenant_field: tenant_id
        classification: tenant_private
        manager: TenantModelManager
        soft_delete: true
        tested: true
        risk: CRITICAL
        notes: "NavView 完全无 apply_tenant_filter 调用"
      - name: Notice
        table: home_notice
        tenant_field: tenant_id
        classification: tenant_private
        manager: TenantModelManager
        soft_delete: true
        tested: true
        risk: CRITICAL
        notes: "NoticeView 完全无 apply_tenant_filter 调用"

  reminder:
    models:
      - name: Reminder
        table: reminder_reminder
        tenant_field: tenant_id
        classification: tenant_private
        manager: TenantModelManager
        soft_delete: true
        tested: true
        risk: PASS
        notes: "手动租户过滤有效, 但 ReminderUsersView 泄露用户列表"
      - name: ReminderLog
        table: reminder_reminder_log
        tenant_field: null
        classification: global
        manager: models.Manager
        soft_delete: false
        tested: false
        risk: LOW

  runlog:
    models:
      - name: RunLog
        table: runlog_runlog
