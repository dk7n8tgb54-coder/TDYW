# Approved Performance Baselines
#
# This file is EMPTY by design. Baselines should only be filled in after
# running actual performance tests against a dedicated test environment.
#
# Process:
# 1. Run performance tests in a controlled test environment
# 2. Collect metrics using helpers/metrics.py
# 3. Review results against thresholds.yml
# 4. If results are acceptable, copy them here as approved baselines
# 5. Future test runs compare against these baselines for regression detection
#
# DO NOT fill in values from dev/production environments.
# DO NOT guess or estimate values.

baselines: {}

