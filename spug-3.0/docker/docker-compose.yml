# Docker Compose 配置文件
# 版本说明：
# - 版本 3.8 是目前推荐的稳定版本，支持最新的 Docker 功能
# - 版本 3.3 也可以使用，但可能缺少一些新和优化
# 使用方法：docker compose -f docker/docker-compose.yml up -d


services:
  # ==================== 主应用服务 ====================
  tdyw:
    # 使用预构建的镜像，先执行: docker build -t spug:latest -f docker/Dockerfile .
    #image: tdyw:20260329
    image: tdyw:0917
    # spug:20260320
    # 如需重新构建镜像，取消以下 build 配置
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    container_name: tdyw
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "80:80"   # HTTP 端口
      - "443:443"  # HTTPS 端口
    environment:
      # 数据库连接配置
      - MYSQL_HOST=tdyw-db
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-tdyw}
      # 敏感信息从 .env 文件读取
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG}
      # Redis 密码（Redis 仅监听 127.0.0.1，密码防容器内未授权访问）
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # 允许访问的IP或域名（从 .env 读取，默认 * 仅用于开发）
      # 生产环境在 .env 中设置为具体值，如: 192.168.40.118,localhost,127.0.0.1
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      # 允许的 Origin（用于 Origin/Referer 校验，防止跨站请求）
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - TZ=Asia/Shanghai
      - KKFILEVIEW_API_URL=${KKFILEVIEW_API_URL:-/kkfileview}
      - KKFILEVIEW_SERVER_URL=${KKFILEVIEW_SERVER_URL:-http://tdyw}
      # ONLYOFFICE Docs 在线编辑（制度管理，2026-10-27）
      # DOCS_URL=浏览器经 nginx 同源代理访问 DS；PUBLIC_BASE_URL=DS 回源本应用
      # JWT_SECRET 与 onlyoffice 服务的 JWT_SECRET 必须一致；留空则在线编辑
      # 自动降级为"下载→本机编辑→上传保存"，不影响其余功能
      - ONLYOFFICE_DOCS_URL=${ONLYOFFICE_DOCS_URL:-/onlyoffice}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - ONLYOFFICE_PUBLIC_BASE_URL=${ONLYOFFICE_PUBLIC_BASE_URL:-http://tdyw}
      - ONLYOFFICE_ALLOWED_URL_HOSTS=${ONLYOFFICE_ALLOWED_URL_HOSTS:-tdyw-onlyoffice,tdyw}
      - ONLYOFFICE_EDITOR_TOKEN_TTL_SECONDS=${ONLYOFFICE_EDITOR_TOKEN_TTL_SECONDS:-3600}
      # Excel 台账 PDF 引擎：chromium（浏览器打印引擎，网页与 PDF 统一排版）/ libreoffice / auto
      - EXCEL_PDF_ENGINE=${EXCEL_PDF_ENGINE:-chromium}
      # 延迟上线开关：逗号分隔的暂不上线模块名（如 equipment_lifecycle），
      # 对应模块不迁移数据库、不注册 API；不设置（默认空）则全量加载
      - RELEASE_PENDING_APPS=${RELEASE_PENDING_APPS:-}
    volumes:
      - tdyw-media:/data/spug/spug_api/media  # 运行日志附件存储
      - tdyw-documents:/data/spug/spug_api/storage/documents  # 资料库文件存储
      - tdyw-document-chunks:/data/spug/spug_api/storage/document_chunks  # 资料库上传分片存储
      - tdyw-institution:/data/spug/spug_api/storage/institution  # 制度管理原稿/草稿/发布版本存储
      - tdyw-logs:/var/log/supervisor  # 日志文件
      - tdyw-nginx-logs:/var/log/nginx  # 结构化运行日志持久化
      - tdyw-health-probe-logs:/var/log/tdyw:ro  # sidecar 外部探活记录
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro  # Nginx 配置
      - ./config/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro  # Supervisor 配置
      - ./certs/prod:/etc/nginx/ssl:ro  # SSL 证书
      - ./certs/install-ca.html:/data/spug/spug_web/build/install-ca.html:ro  # 证书安装页面
      - ./certs/ca/ca.crt:/data/spug/spug_web/build/ca.crt:ro  # CA证书下载
      # institution .doc->.docx 转换中文字体（与 onlyoffice 服务共用
      # onlyoffice-fonts/，含 sim 全系宋体/仿宋/黑体/楷体等，与 dev 一致）。
      # 目录须先按 onlyoffice-main/README.md 放置授权字体（字体文件因授权
      # 不入 Git）；为空时回退镜像内 fonts-noto-cjk。
      - ./onlyoffice-fonts:/usr/share/fonts/custom:ro
    depends_on:
      tdyw-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/api/document/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4'           # 主应用服务 CPU 限制（MD5计算、文件处理需较多CPU）
          memory: 4G          # 32G 服务器：4G（2×Gunicorn + 7×Celery worker + Redis + Nginx）
        reservations:
          cpus: '1'           # 保证至少 1 个 CPU 核心
          memory: 1G          # 保证至少 1GB 内存
    networks:
      - tdyw-network

  # ==================== 外部平台探活 sidecar ====================
  # 与 tdyw 分离，避免容器内进程存活被误认为 Web 可用
  tdyw-health-probe:
    image: tdyw:0917
    container_name: tdyw-health-probe
    restart: unless-stopped
    entrypoint: ["python", "/opt/health_probe.py"]
    environment:
      - HEALTH_PROBE_URL=${HEALTH_PROBE_URL:-http://tdyw/api/document/health/}
      - HEALTH_PROBE_LOG=/var/log/tdyw/health-probe.jsonl
      - NGINX_LOG=/var/log/nginx/run_metrics.log
      - HEALTH_PROBE_INTERVAL=${HEALTH_PROBE_INTERVAL:-60}
    volumes:
      - ./scripts/health_probe.py:/opt/health_probe.py:ro
      - tdyw-health-probe-logs:/var/log/tdyw
      - tdyw-nginx-logs:/var/log/nginx
    depends_on:
      tdyw:
        condition: service_started
    # 覆盖镜像内置 healthcheck（curl localhost:80，sidecar 内没有该服务）：
    # 改为检查真实探活产物——探活日志 3 分钟内（默认间隔 60s 的 3 个周期）有写入。
    # 若通过 HEALTH_PROBE_INTERVAL 调大间隔，请同步调整 -mmin 容忍窗口。
    healthcheck:
      test: ["CMD", "sh", "-c", "find /var/log/tdyw/health-probe.jsonl -mmin -3 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - tdyw-network

  # ==================== 数据库服务 ====================
  tdyw-db:
    # image: tdyw-mysql:10.8.2
    image: mysql:0601
    container_name: tdyw-db
    restart: unless-stopped
    stop_grace_period: 90s  # InnoDB buffer pool 6G 需要足够时间刷盘，默认 10 秒不够
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      # MySQL 镜像内置支持：首次初始化时自动创建此用户并授予 MYSQL_DATABASE 的全部权限
      # 已有数据库需手动执行一次 docker/scripts/init_tdyw_account.sql
      - MYSQL_USER=${MYSQL_USER:-tdyw}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - TZ=Asia/Shanghai
    volumes:
      # 挂载到临时位置（不是直接挂载到 /etc/mysql/conf.d/）
      - ./config/mysqlnew.cnf:/tmp/mysql-config/custom.cnf:ro
      - ./config/mysql-entrypoint.sh:/usr/local/bin/mysql-custom-entrypoint.sh:ro
      - tdyw-mysql-data:/var/lib/mysql  # 数据持久化
    ports:
      - "127.0.0.1:3306:3306"  # 使用高位端口避免 Hyper-V 端口保留冲突
    # 使用自定义 entrypoint 处理权限问题
    entrypoint: ["/bin/bash", "/usr/local/bin/mysql-custom-entrypoint.sh"]
    command: ["mysqld"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}", "-s"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'           # 数据库 CPU 限制（主要是IO操作，CPU需求相对较低）
          memory: 8G          # 32G 服务器：8G（buffer_pool 6G + 连接/日志/OS 2G）
        reservations:
          cpus: '0.5'         # 保证至少 0.5 个 CPU 核心
          memory: 2G          # 保证至少 2GB 内存
    networks:
      - tdyw-network

  # ==================== kkFileView 文件预览服务 ====================
  # Office文档在线预览服务（支持 doc/docx/xls/xlsx/ppt/pptx 等 80+ 格式）
  # 部署文档：https://github.com/kekingcn/kkFileView
  kkfileview:
    image: keking/kkfileview:4.1.0
    container_name: tdyw-kkfileview
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - KK_CONTEXT_PATH=/kkfileview        # 上下文路径，与Nginx代理路径1:1映射
      - KK_OFFICE_PREVIEW_TYPE=image       # Office预览方式：image(图片模式，性能好) 或 pdf
      - KK_CACHE_ENABLED=true              # 启用缓存，避免重复转换
      - KK_FILE_UPLOAD_ENABLED=false       # 禁止通过kkFileView上传文件（安全）
      - KK_HISTORY_FILE_CLEAN_ENABLED=true  # 启用历史文件清理
      - KK_HISTORY_FILE_CLEAN_CYCLE=720    # 清理周期（分钟），12小时
      - KK_BASE_URL=${KKFILEVIEW_BASE_URL:-https://localhost:443/kkfileview}  # 浏览器访问kkFileView的外部地址，否则PDF预览会指向127.0.0.1
      - TZ=Asia/Shanghai
    volumes:
      - tdyw-kkfileview-cache:/opt/kkFileView-4.1.0/file  # 预览缓存持久化
    deploy:
      resources:
        limits:
          cpus: '2'           # LibreOffice转换需要较多CPU
          memory: 2G          # 32G 服务器：2G（Office转换峰值内存高，但并发低）
        reservations:
          cpus: '0.5'
          memory: 768M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8012/kkfileview/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s     # LibreOffice首次启动较慢
    networks:
      - tdyw-network

  # ==================== ONLYOFFICE Docs 在线编辑服务 ====================
  # 制度管理 Word 手册在线编辑（2026-10-27）。与 kkFileView（只读预览）
  # 相互独立：编辑走 onlyoffice + JWT 回调，预览继续走 kkfileview。
  # 浏览器经 tdyw nginx 的 /onlyoffice/ 同源代理访问；DS 回源应用走
  # http://tdyw（tdyw 网络别名）。生产启用在线编辑 = .env 配 ONLYOFFICE_* 全套
  # （键清单见 .env.example ONLYOFFICE 段，启用步骤见 onlyoffice-main/README.md）；
  # 未配置 ONLYOFFICE_JWT_SECRET 时应用侧自动降级为"下载→本机编辑→上传保存"，
  # 不影响其余功能。
  # .env 未配置 ONLYOFFICE_* 键时（2026-10-31 审查修正）：本栈各服务的变量占位
  # 一律空缺省，**不影响 tdyw/db/kkfileview 等其他服务的任何 compose 操作**；
  # OO 栈自身在启动层 fail-closed——DB 空密码初始化被 postgres 镜像拒绝、
  # MQ 账号缺失被入口包装脚本拒绝，均以明确错误退出，绝不静默弱凭据运行。
  #
  # 2026-10-31 对齐 dev 已验证的 10.0 架构（蓝本 dev/docker-compose.yml，经 oo-10
  # 隔离对照实例全链路验证通过；dev 主实例版本 10.0.0 Build 169）：
  # - 10.0 社区版不再内置 PostgreSQL/RabbitMQ，新增 onlyoffice-db/onlyoffice-mq
  #   两个外部服务；且 10.0 社区版镜像忽略 DB_*/AMQP_URI 环境变量，DB/队列连接
  #   由入口包装脚本 docker/onlyoffice-main/ds-entrypoint.sh 按环境变量渲染
  #   local.json 下发（local.json 不可直接 bind-mount，见该脚本注释）。
  # - 数据全部落在 *-10 新卷；2026-10-31 起应用层（后端 editor_services
  #   forcesave 仅 /command 直连）不再兼容 8.1，回退到 8.1 需连同后端代码
  #   一起回退并补跑 documentserver-generate-allfonts.sh。8.1 旧数据卷
  #   （tdyw-onlyoffice-data/tdyw-onlyoffice-log）已不在本文件声明，卷数据
  #   仍保留在 docker 卷存储中作数据保险，未经确认绝不手动删除。
  onlyoffice:
    image: onlyoffice/documentserver:10.0
    container_name: tdyw-onlyoffice
    restart: unless-stopped
    stop_grace_period: 60s
    # 入口包装：先校验必需环境变量、渲染 DB/队列/JWT 覆盖配置，再交回官方入口
    # （详见 docker/onlyoffice-main/ds-entrypoint.sh 注释）
    entrypoint: ["/bin/bash", "/custom-ds-config/ds-entrypoint.sh"]
    depends_on:
      onlyoffice-db:
        condition: service_healthy
      onlyoffice-mq:
        condition: service_healthy
    environment:
      # ---- DB/队列连接（仅供入口包装脚本渲染 local.json；10.0 社区版不读取
      # DB_*/AMQP_URI 环境变量本身）----
      - ONLYOFFICE_DB_HOST=onlyoffice-db
      - ONLYOFFICE_DB_PORT=5432
      - ONLYOFFICE_DB_NAME=onlyoffice
      - ONLYOFFICE_DB_USER=onlyoffice
      - ONLYOFFICE_DB_PASSWORD=${ONLYOFFICE_DB_PASSWORD:-}
      # MQ 账号透传仅供入口包装脚本 fail-closed 校验（缺失即拒绝启动 DS）
      - ONLYOFFICE_MQ_USER=${ONLYOFFICE_MQ_USER:-}
      - ONLYOFFICE_MQ_PASSWORD=${ONLYOFFICE_MQ_PASSWORD:-}
      - ONLYOFFICE_AMQP_URI=amqp://${ONLYOFFICE_MQ_USER}:${ONLYOFFICE_MQ_PASSWORD}@onlyoffice-mq:5672
      # JWT 双向签名：与 tdyw 服务的 ONLYOFFICE_JWT_SECRET 一致（.env 统一提供）
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
      # 10.0 中该变量仅剩 rejectUnauthorized=false 语义；私网回源由 JWT 签名
      # URL 兜底（directIfIn.jwtToken 默认 true，dev 已实测）
      - USE_UNAUTHORIZED_STORAGE=true
      - TZ=Asia/Shanghai
    volumes:
      - tdyw-onlyoffice-log-10:/var/log/onlyoffice
      - tdyw-onlyoffice-data-10:/var/lib/onlyoffice   # 文档缓存（10.0 新卷）
      # 中文字体补充（与 dev 同一套清单，见 onlyoffice-main/README.md；增删字体后
      #   docker exec tdyw-onlyoffice documentserver-generate-allfonts.sh
      # 10.0 启动时也会自动重建字体索引，GENERATE_FONTS 默认 true）
      - ./onlyoffice-fonts:/usr/share/fonts/custom:ro
      # 入口包装脚本目录（只读；不能直接挂 local.json 单文件——官方入口
      # npm json -I 原地重写会 EBUSY，故由脚本启动时渲染到容器内普通文件）
      - ./onlyoffice-main:/custom-ds-config:ro
    deploy:
      resources:
        limits:
          cpus: '2'           # 文档转换消耗 CPU（与 kkfileview 相当）
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s    # 首次启动需建表/重建字体索引等，较慢
    networks:
      - tdyw-network

  # ==================== ONLYOFFICE 10.0 专用外部 PostgreSQL ====================
  # 10.0 社区版镜像无内置数据库（内置启动分支为商业版限定）；表结构由
  # docker/onlyoffice-main/createdb.sql（从 10.0 镜像提取，仅建表）在
  # postgres 首次初始化时自动导入，建库由 POSTGRES_DB 完成。
  # user/db 固定 onlyoffice（仅 Compose 内网可达，不发布宿主机端口）；
  # 密码独立生成，与 dev 开发凭据完全不同。
  # 凭据缺失的语义（2026-10-31 审查修正）：占位一律为空缺省，.env 未配置
  # ONLYOFFICE_* 键时**不影响其他服务的任何 compose 操作**；OO 栈自身的
  # fail-closed 在启动层——postgres 镜像对"空密码 + 全新数据卷初始化"直接
  # 拒绝启动，入口包装脚本（ds-entrypoint.sh）在 DS 启动前校验全部凭据，
  # 二者都不会静默以空/弱凭据运行。
  onlyoffice-db:
    image: postgres:16-alpine
    container_name: tdyw-onlyoffice-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=onlyoffice
      - POSTGRES_USER=onlyoffice
      # 与 onlyoffice 服务的 ONLYOFFICE_DB_PASSWORD 同源（.env 统一提供）。
      # 空值时 postgres 镜像在全新卷初始化阶段直接报错退出（防止空密码静默
      # 启动）；已初始化的存量卷重启不读取该值，不受影响。
      - POSTGRES_PASSWORD=${ONLYOFFICE_DB_PASSWORD:-}
    volumes:
      - tdyw-onlyoffice-postgresql-10:/var/lib/postgresql/data
      - ./onlyoffice-main/createdb.sql:/docker-entrypoint-initdb.d/10-createdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlyoffice -d onlyoffice"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - tdyw-network

  # ==================== ONLYOFFICE 10.0 专用外部 RabbitMQ ====================
  # 10.0 社区版镜像无内置队列；guest 账号仅限 localhost 登录，必须用独立账号
  # 远程连接（.env 的 ONLYOFFICE_MQ_USER/ONLYOFFICE_MQ_PASSWORD）。
  # 凭据占位为空缺省（理由见 onlyoffice-db 注释）：.env 未配置不影响其他
  # 服务的 compose 操作；DS 启动前入口包装脚本校验 MQ 账号非空，缺失即
  # 拒绝启动，绝不以 guest/空口令静默运行。
  # 相比 dev 版刻意加固：dev 的 mq 无健康检查、onlyoffice 仅 service_started，
  # 生产加 rabbitmq-diagnostics -q ping 健康检查并 service_healthy，
  # 保证 onlyoffice 启动时队列已真正可用。
  onlyoffice-mq:
    image: rabbitmq:4-alpine
    container_name: tdyw-onlyoffice-mq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${ONLYOFFICE_MQ_USER:-}
      - RABBITMQ_DEFAULT_PASSWORD=${ONLYOFFICE_MQ_PASSWORD:-}
    volumes:
      - tdyw-onlyoffice-rabbitmq-10:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - tdyw-network

networks:
  tdyw-network:
    driver: bridge

volumes:
  tdyw-mysql-data:
    driver: local
  tdyw-media:
    driver: local
  tdyw-documents:
    driver: local
  tdyw-document-chunks:
    driver: local
  tdyw-institution:
    driver: local
  # ---- ONLYOFFICE 8.1 旧卷不在本文件声明（2026-10-31 清理）----
  # tdyw-onlyoffice-data / tdyw-onlyoffice-log 两个 8.1 卷的数据仍保留在
  # docker 卷存储中（docker volume ls 可见）作数据保险；应用层已不兼容 8.1，
  # 回退需连同后端代码一起回退。未经确认绝不手动删除卷数据。
  # ---- ONLYOFFICE 10.0 主实例新卷（2026-10-31）----
  tdyw-onlyoffice-log-10:
    driver: local
  tdyw-onlyoffice-data-10:
    driver: local
  tdyw-onlyoffice-postgresql-10:
    driver: local
  tdyw-onlyoffice-rabbitmq-10:
    driver: local
  tdyw-logs:
    driver: local
  tdyw-nginx-logs:
    driver: local
  tdyw-health-probe-logs:
    driver: local
  tdyw-kkfileview-cache:
    driver: local
