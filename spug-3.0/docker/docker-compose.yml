# Docker Compose 配置文件
# 版本说明：
# - 版本 3.8 是目前推荐的稳定版本，支持最新的 Docker 功能
# - 版本 3.3 也可以使用，但可能缺少一些新和优化
# 使用方法：docker-compose -f docker/docker-compose.yml up -d
version: '3.8'

services:
  # ==================== 主应用服务 ====================
  tdyw:
    # 使用预构建的镜像，先执行: docker build -t spug:latest -f docker/Dockerfile .
    #image: tdyw:20260329
    image: tdyw:0623
    # spug:20260320
    # 如需重新构建镜像，取消以下 build 配置
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    container_name: tdyw
    restart: unless-stopped
    ports:
      - "8080:80"   # HTTP 端口
      - "443:443"  # HTTPS 端口
    environment:
      # 数据库连接配置（固定值）
      - MYSQL_HOST=tdyw-db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      # 敏感信息从 .env 文件读取
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG}
      # 允许访问的IP或域名（安全设置）
      # "*" 表示允许任何IP访问（适合开发/内网环境）
      # 生产环境建议写具体值，例如："192.168.1.100" 或 "api.example.com"
      # 多个地址用逗号分隔，例如："192.168.1.100,api.example.com"
      - ALLOWED_HOSTS=*
      - TZ=Asia/Shanghai
      - KKFILEVIEW_API_URL=${KKFILEVIEW_API_URL:-/kkfileview}
      - KKFILEVIEW_SERVER_URL=${KKFILEVIEW_SERVER_URL:-http://tdyw}
    volumes:
      - tdyw-media:/data/spug/spug_api/media  # 运行日志附件存储
      - tdyw-documents:/data/spug/spug_api/storage/documents  # 资料库文件存储
      - tdyw-document-chunks:/data/spug/spug_api/storage/document_chunks  # 资料库上传分片存储
      - tdyw-logs:/var/log/supervisor  # 日志文件
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro  # Nginx 配置
      - ./config/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro  # Supervisor 配置
      - ./certs/prod:/etc/nginx/ssl:ro  # SSL 证书
      - ./certs/install-ca.html:/data/spug/spug_web/build/install-ca.html:ro  # 证书安装页面
      - ./certs/ca/ca.crt:/data/spug/spug_web/build/ca.crt:ro  # CA证书下载
    depends_on:
      tdyw-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/api/document/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4'           # 主应用服务 CPU 限制（MD5计算、文件处理需较多CPU）
          memory: 4G          # 主应用服务内存限制（资料库、运行日志、Celery需较大内存）
        reservations:
          cpus: '1'           # 保证至少 1 个 CPU 核心
          memory: 1G          # 保证至少 1GB 内存
    networks:
      - tdyw-network

  # ==================== 数据库服务 ====================
  tdyw-db:
    # image: tdyw-mysql:10.8.2
    image: mysql:0601
    container_name: tdyw-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - TZ=Asia/Shanghai
    volumes:
      # 挂载到临时位置（不是直接挂载到 /etc/mysql/conf.d/）
      - ./config/mysqlnew.cnf:/tmp/mysql-config/custom.cnf:ro
      - ./config/mysql-entrypoint.sh:/usr/local/bin/mysql-custom-entrypoint.sh:ro
      - tdyw-mysql-data:/var/lib/mysql  # 数据持久化
    ports:
      - "127.0.0.1:3308:3306"  # 使用高位端口避免 Hyper-V 端口保留冲突
    # 使用自定义 entrypoint 处理权限问题
    entrypoint: ["/bin/bash", "/usr/local/bin/mysql-custom-entrypoint.sh"]
    command: ["mysqld"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}", "-s"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'           # 数据库 CPU 限制（主要是IO操作，CPU需求相对较低）
          memory: 8G          # 根据数据量调整（资料库、运行日志数据量大需更多内存）
        reservations:
          cpus: '0.5'         # 保证至少 0.5 个 CPU 核心
          memory: 2G          # 保证至少 2GB 内存
    networks:
      - tdyw-network

  # ==================== kkFileView 文件预览服务 ====================
  # Office文档在线预览服务（支持 doc/docx/xls/xlsx/ppt/pptx 等 80+ 格式）
  # 部署文档：https://github.com/kekingcn/kkFileView
  kkfileview:
    image: keking/kkfileview:4.1.0
    container_name: tdyw-kkfileview
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - KK_CONTEXT_PATH=/kkfileview        # 上下文路径，与Nginx代理路径1:1映射
      - KK_OFFICE_PREVIEW_TYPE=image       # Office预览方式：image(图片模式，性能好) 或 pdf
      - KK_CACHE_ENABLED=true              # 启用缓存，避免重复转换
      - KK_FILE_UPLOAD_ENABLED=false       # 禁止通过kkFileView上传文件（安全）
      - KK_HISTORY_FILE_CLEAN_ENABLED=true  # 启用历史文件清理
      - KK_HISTORY_FILE_CLEAN_CYCLE=720    # 清理周期（分钟），12小时
      - KK_BASE_URL=${KKFILEVIEW_BASE_URL:-https://localhost:443/kkfileview}  # 浏览器访问kkFileView的外部地址，否则PDF预览会指向127.0.0.1
      - TZ=Asia/Shanghai
    volumes:
      - tdyw-kkfileview-cache:/opt/kkFileView-4.1.0/file  # 预览缓存持久化
    deploy:
      resources:
        limits:
          cpus: '2'           # LibreOffice转换需要较多CPU
          memory: 4G          # Office转换需要较大内存（大docx含图片需4G+）
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8012/kkfileview/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s     # LibreOffice首次启动较慢
    networks:
      - tdyw-network

networks:
  tdyw-network:
    driver: bridge

volumes:
  tdyw-mysql-data:
    driver: local
  tdyw-media:
    driver: local
  tdyw-documents:
    driver: local
  tdyw-document-chunks:
    driver: local
  tdyw-logs:
    driver: local
  tdyw-kkfileview-cache:
    driver: local
