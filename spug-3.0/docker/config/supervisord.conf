[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

# 【补充5】Supervisor全局文件句柄配置
# 确保Supervisor启动的子进程继承足够的资源限制
minfds=65535      # 最小文件句柄数
minprocs=65535    # 最小进程数

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log
priority=10

[program:redis]
command=redis-server --daemonize no --bind 127.0.0.1 --port 6379
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis_err.log
priority=15

[program:spug-api]
command=bash /data/spug/spug_api/tools/start-api.sh
directory=/data/spug/spug_api
autostart=true
autorestart=true
stdout_logfile=/data/spug/spug_api/logs/api.log
stderr_logfile=/data/spug/spug_api/logs/api_err.log
redirect_stderr=false
environment=DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=20

[program:spug-ws]
command=bash /data/spug/spug_api/tools/start-ws.sh
directory=/data/spug/spug_api
autostart=true
autorestart=true
stdout_logfile=/data/spug/spug_api/logs/ws.log
stderr_logfile=/data/spug/spug_api/logs/ws_err.log
redirect_stderr=false
environment=DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=25

[program:spug-worker]
command=bash /data/spug/spug_api/tools/start-worker.sh
directory=/data/spug/spug_api
autostart=true
autorestart=true
stdout_logfile=/data/spug/spug_api/logs/worker.log
stderr_logfile=/data/spug/spug_api/logs/worker_err.log
redirect_stderr=false
environment=DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=30

[program:spug-celery]
command=bash /data/spug/spug_api/tools/start-celery.sh
directory=/data/spug/spug_api
autostart=true
autorestart=true
stdout_logfile=/data/spug/spug_api/logs/celery.log
stderr_logfile=/data/spug/spug_api/logs/celery_err.log
redirect_stderr=false
environment=DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=35

[program:spug-celery-beat]
command=bash /data/spug/spug_api/tools/start-celery-beat.sh
directory=/data/spug/spug_api
autostart=true
autorestart=true
stdout_logfile=/data/spug/spug_api/logs/celery-beat.log
stderr_logfile=/data/spug/spug_api/logs/celery-beat_err.log
redirect_stderr=false
environment=DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=40

# Merge Worker: 只监听 document.merge 队列，专用合并 worker
# 依据: 《资料库并发上传与状态机修复方案》5.3 拆分 Celery merge worker
# 并发默认 4，可通过环境变量 CELERY_MERGE_CONCURRENCY 覆盖
[program:spug-celery-merge]
command=bash /data/spug/spug_api/tools/start-celery-merge.sh
directory=/data/spug/spug_api
autostart=true
autorestart=true
stdout_logfile=/data/spug/spug_api/logs/celery-merge.log
stderr_logfile=/data/spug/spug_api/logs/celery-merge_err.log
redirect_stderr=false
environment=DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=45

# Batch Worker: 只监听 document.batch 队列，批量操作专用
# 依据: 《资料库并发上传与状态机修复方案》5.3 拆分 Celery merge worker
# 并发默认 2，可通过环境变量 CELERY_BATCH_CONCURRENCY 覆盖
[program:spug-celery-batch]
command=bash /data/spug/spug_api/tools/start-celery-batch.sh
directory=/data/spug/spug_api
autostart=true
autorestart=true
stdout_logfile=/data/spug/spug_api/logs/celery-batch.log
stderr_logfile=/data/spug/spug_api/logs/celery-batch_err.log
redirect_stderr=false
environment=DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=46
