[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

# 【补充5】Supervisor全局文件句柄配置
# 确保Supervisor启动的子进程继承足够的资源限制
minfds=65535      # 最小文件句柄数
minprocs=65535    # 最小进程数

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log
priority=10

[program:redis]
command=redis-server --daemonize no --bind 127.0.0.1 --port 6379
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis_err.log
priority=15

[program:spug-api]
command=bash /data/spug/spug_api/tools/start-api.sh
directory=/data/spug/spug_api
autostart=true
autorestart=true
stdout_logfile=/data/spug/spug_api/logs/api.log
stderr_logfile=/data/spug/spug_api/logs/api_err.log
redirect_stderr=false
environment=DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=20
stopsignal=TERM
stopwaitsecs=300
stopasgroup=true
killasgroup=true

# 【6.2】上传专用 API服务 - 隔离上传落盘 I/O
# 依据: 《资料库并发上传与状态机修复方案》6.2 上传 API 与普通 API 隔离
# 职责: 专门处理文件上传/分片/合并接口，避免阻塞普通 API worker
# 端口: 9003 (9001=普通API, 9002=WebSocket, 9003=上传API)
# 回滚: 删除此 program 段并重启 supervisor 即可
[program:spug-api-upload]
command=bash /data/spug/spug_api/tools/start-api-upload.sh
directory=/data/spug/spug_api
autostart=true
autorestart=true
stdout_logfile=/data/spug/spug_api/logs/api-upload.log
stderr_logfile=/data/spug/spug_api/logs/api-upload_err.log
redirect_stderr=false
environment=DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=21
stopsignal=TERM
stopwaitsecs=300
stopasgroup=true
killasgroup=true

[program:spug-ws]
command=bash /data/spug/spug_api/tools/start-ws.sh
directory=/data/spug/spug_api
autostart=true
autorestart=true
stdout_logfile=/data/spug/spug_api/logs/ws.log
stderr_logfile=/data/spug/spug_api/logs/ws_err.log
redirect_stderr=false
environment=DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=25
stopsignal=TERM
stopwaitsecs=300
stopasgroup=true
killasgroup=true

[program:spug-worker]
command=bash /data/spug/spug_api/tools/start-worker.sh
directory=/data/spug/spug_api
autostart=true
autorestart=true
stdout_logfile=/data/spug/spug_api/logs/worker.log
stderr_logfile=/data/spug/spug_api/logs/worker_err.log
redirect_stderr=false
environment=DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=30
stopsignal=TERM
stopwaitsecs=300
stopasgroup=true
killasgroup=true

[program:spug-celery]
command=bash /data/spug/spug_api/tools/start-celery.sh
directory=/data/spug/spug_api
autostart=true
autorestart=true
stdout_logfile=/data/spug/spug_api/logs/celery.log
stderr_logfile=/data/spug/spug_api/logs/celery_err.log
redirect_stderr=false
environment=DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=35
stopsignal=TERM
stopwaitsecs=900
stopasgroup=true
killasgroup=true

# Default Worker: 只监听 celery 默认队列（定时任务、消息通知等通用任务）
# 依据: 《资料库并发上传与状态机修复方案》5.3 拆分 Celery merge worker
# 并发默认 2，可通过环境变量 CELERY_DEFAULT_CONCURRENCY 覆盖
# 说明: 不再消费任何 document.* 队列（merge/batch/cleanup 各自由专用 worker 处理）

# Cleanup Worker: 只监听 document.cleanup 队列（上传链路清理专用）
# 依据: 《资料库并发上传与状态机修复方案》5.3 拆分 Celery merge worker
# 职责: 旧分片清理 / 过期传输记录清理 / 孤儿传输记录清理 / 卡住 merging 任务清理 / 物理文件待清理重试
# 并发默认 1，可通过环境变量 CELERY_CLEANUP_CONCURRENCY 覆盖
[program:spug-celery-cleanup]
command=bash /data/spug/spug_api/tools/start-celery-cleanup.sh
directory=/data/spug/spug_api
autostart=true
autorestart=true
stdout_logfile=/data/spug/spug_api/logs/celery-cleanup.log
stderr_logfile=/data/spug/spug_api/logs/celery-cleanup_err.log
redirect_stderr=false
environment=DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=36
stopsignal=TERM
stopwaitsecs=900
stopasgroup=true
killasgroup=true

# Merge Worker: 只监听 document.merge 队列，专用合并 worker
# 依据: 《资料库并发上传与状态机修复方案》5.3 拆分 Celery merge worker
# 并发默认 2（适合 8G 内存、普通 SSD/机械盘服务器），可通过环境变量 CELERY_MERGE_CONCURRENCY 覆盖
# 生产建议: 小型服务器(8G)用 1-2，高性能服务器(NVMe/16G+)可用 3-4
[program:spug-celery-merge]
command=bash /data/spug/spug_api/tools/start-celery-merge.sh
directory=/data/spug/spug_api
autostart=true
autorestart=true
stdout_logfile=/data/spug/spug_api/logs/celery-merge.log
stderr_logfile=/data/spug/spug_api/logs/celery-merge_err.log
redirect_stderr=false
environment=DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1",CELERY_MERGE_CONCURRENCY="2"
priority=45
stopsignal=TERM
stopwaitsecs=900
stopasgroup=true
killasgroup=true

# Batch Worker: 只监听 document.batch 队列，批量操作专用
# 依据: 《资料库并发上传与状态机修复方案》5.3 拆分 Celery merge worker
# 职责: 传输记录批量删除、批量取消（apps.document.views.transfer.batch 仍在调用）
# 并发默认 2，可通过环境变量 CELERY_BATCH_CONCURRENCY 覆盖
[program:spug-celery-batch]
command=bash /data/spug/spug_api/tools/start-celery-batch.sh
directory=/data/spug/spug_api
autostart=true
autorestart=true
stdout_logfile=/data/spug/spug_api/logs/celery-batch.log
stderr_logfile=/data/spug/spug_api/logs/celery-batch_err.log
redirect_stderr=false
environment=DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=46
stopsignal=TERM
stopwaitsecs=900
stopasgroup=true
killasgroup=true

# Thumbnail Worker: 只监听 document.thumbnail 队列，缩略图生成专用
# 依据: 《资料库上传性能优化建议》第 4 项 - 缩略图生成改异步
# 职责: 上传/合并完成后异步生成图片缩略图（Pillow 解码），避免拖慢上传 API 和合并 worker
# 并发默认 1（8G 服务器建议），可通过环境变量 CELERY_THUMBNAIL_CONCURRENCY 覆盖
# 注意: 若暂不部署此 worker，需让 cleanup/default worker 兼听 document.thumbnail 队列，
#       否则缩略图任务会堆积无人消费（修改 start-celery-cleanup.sh 的 -Q 参数即可）
[program:spug-celery-thumbnail]
command=bash /data/spug/spug_api/tools/start-celery-thumbnail.sh
directory=/data/spug/spug_api
autostart=true
autorestart=true
stdout_logfile=/data/spug/spug_api/logs/celery-thumbnail.log
stderr_logfile=/data/spug/spug_api/logs/celery-thumbnail_err.log
redirect_stderr=false
environment=DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=48
stopsignal=TERM
stopwaitsecs=900
stopasgroup=true
killasgroup=true

# Celery Beat: 定时任务调度器（独立启动，不消费业务队列）
[program:spug-celery-beat]
command=bash /data/spug/spug_api/tools/start-celery-beat.sh
directory=/data/spug/spug_api
autostart=true
autorestart=true
stdout_logfile=/data/spug/spug_api/logs/celery-beat.log
stderr_logfile=/data/spug/spug_api/logs/celery-beat_err.log
redirect_stderr=false
environment=DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=50
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true

# Radio License Worker: 只监听 radio_license 队列
# 职责: 无线电台执照到期扫描（每天 08:00 由 beat 触发，更新 license.status）
# 并发 1（执照扫描每天才跑一次，低频任务）
[program:spug-celery-radio-license]
command=celery -A spug worker -l info -Q radio_license -n radio-license-worker@%%h -c 1 --prefetch-multiplier=1 --max-tasks-per-child=100
directory=/data/spug/spug_api
autostart=true
autorestart=true
stdout_logfile=/data/spug/spug_api/logs/celery-radio-license.log
stderr_logfile=/data/spug/spug_api/logs/celery-radio-license_err.log
redirect_stderr=false
environment=DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=47
stopsignal=TERM
stopwaitsecs=900
stopasgroup=true
killasgroup=true
