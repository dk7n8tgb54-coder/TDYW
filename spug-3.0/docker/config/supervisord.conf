[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

# 【补充5】Supervisor全局文件句柄配置
# 确保Supervisor启动的子进程继承足够的资源限制
minfds=65535      # 最小文件句柄数
minprocs=65535    # 最小进程数

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log
priority=10

[program:redis]
command=redis-server --daemonize no --bind 127.0.0.1 --port 6379
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis_err.log
priority=15

[program:spug-api]
command=bash /data/spug/spug_api/tools/start-api.sh
directory=/data/spug/spug_api
autostart=true
autorestart=true
stdout_logfile=/data/spug/spug_api/logs/api.log
stderr_logfile=/data/spug/spug_api/logs/api_err.log
redirect_stderr=false
environment=DJANGO_SETTINGS_MODULE="spug.settings",PYTHONUNBUFFERED="1"
priority=20

