# Production Nginx Configuration for Docker (HTTP only - for testing)
# 生产级HTTP配置，测试环境使用

# ============================================
# 全局配置 - 工作进程与资源限制
# ============================================
user root;
worker_processes auto;
worker_rlimit_nofile 65535;  # 增加文件描述符限制，解决高并发连接问题
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# ============================================
# 事件处理配置 - 高并发连接优化
# ============================================
events {
    worker_connections 4096;  # 从1024增加到4096，支持更多并发连接
    use epoll;                # 使用epoll事件模型，提高性能
    multi_accept on;          # 允许多个连接同时建立
}

# ============================================
# HTTP 模块配置
# ============================================
http {
    # 日志格式定义
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # ============================================
    # 速率限制配置 - 防暴力破解和DDoS保护
    # ============================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # ============================================
    # 基础性能优化配置
    # ============================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    include /etc/nginx/conf.d/*.conf;

    # ============================================
    # 【gevent优化】Upstream 配置 - 保持与后端长连接
    # ============================================
    upstream django_backend {
        server 127.0.0.1:9001;
        keepalive 100;  # 保持100个空闲长连接
    }

    # ============================================
    # kkFileView 预览服务 - Docker 内置 DNS 解析器
    # 使用变量方式代理，避免 kkfileview 容器未启动时 Nginx 无法启动
    # ============================================
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ============================================
    # HTTP 服务器 (80端口)
    # /api/ 请求直接代理（kkFileView内部回调、Docker健康检查需要）
    # 其他请求跳转到HTTPS
    # ============================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # API请求不走HTTPS跳转（kkFileView内部回调、健康检查等）
        location ^~ /api/ {
            rewrite ^/api(.*) $1 break;
            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_redirect off;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        # kkFileView代理（HTTP 80端口也需要，kkFileView内部可能重定向到自身）
        location ^~ /kkfileview/ {
            set $kkfileview_upstream http://kkfileview:8012;
            proxy_pass $kkfileview_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 100m;
        }

        # 媒体文件也直接服务（kkFileView可能需要访问）
        location /media/ {
            alias /data/spug/spug_api/media/;
            expires 30d;
        }

        # 其他请求跳转到HTTPS
        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    # ============================================
    # HTTPS 主服务器 (443端口) - 生产环境推荐
    # ============================================
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        # --------------------------------------------
        # SSL/TLS 安全配置
        # --------------------------------------------
        ssl_certificate /etc/nginx/ssl/spug.crt;
        ssl_certificate_key /etc/nginx/ssl/spug.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # --------------------------------------------
        # 站点根目录与安全响应头
        # --------------------------------------------
        root /data/spug/spug_web/build;
        client_max_body_size 0;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # --------------------------------------------
        # Gzip 压缩配置
        # --------------------------------------------
        gzip on;
        gzip_min_length 1k;
        gzip_buffers 4 16k;
        gzip_http_version 1.1;
        gzip_comp_level 7;
        gzip_types text/plain text/css text/javascript application/javascript application/json;
        gzip_disable "MSIE [1-6]\.";
        gzip_vary on;

        # --------------------------------------------
        # API 反向代理 - 转发到Django后端
        # --------------------------------------------
        location ^~ /api/ {
            rewrite ^/api(.*) $1 break;
            proxy_pass http://django_backend;  # 【优化】使用 upstream 保持长连接
            proxy_http_version 1.1;             # 【优化】HTTP/1.1 支持 keepalive
            proxy_set_header Connection "";     # 【优化】允许连接复用
            proxy_set_header Host $host;           # 【修复】显式设置 Host 头
            proxy_read_timeout 300s;
            proxy_redirect off;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
        }

        # --------------------------------------------
        # WebSocket 代理 - 实时消息推送
        # --------------------------------------------
        location ^~ /api/ws/ {
            rewrite ^/api(.*) $1 break;
            proxy_pass http://127.0.0.1:9002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
        }

        # --------------------------------------------
        # kkFileView Office文档预览服务代理
        # 前端通过 /kkfileview/ 路径访问kkFileView
        # 使用变量方式，Nginx启动时不解析主机名，请求时动态解析
        # KK_CONTEXT_PATH=/kkfileview，路径1:1映射，无需重写
        # --------------------------------------------
        location ^~ /kkfileview/ {
            set $kkfileview_upstream http://kkfileview:8012;
            proxy_pass $kkfileview_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 100m;
            add_header X-Frame-Options SAMEORIGIN always;
        }

        # --------------------------------------------
        # 前端静态文件与SPA路由支持
        # --------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # --------------------------------------------
        # 媒体文件服务 - 长期缓存优化
        # --------------------------------------------
        location /media/ {
            alias /data/spug/spug_api/media/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
