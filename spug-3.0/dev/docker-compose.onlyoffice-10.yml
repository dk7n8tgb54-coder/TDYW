# ==================== ONLYOFFICE 10.0 升级对照实例（隔离） ====================
# 制度管理 DS 8.1 -> 10.0 升级验证（2026-10-30）：与 dev/docker-compose.yml 的
# 8.1 主实例（tdyw-onlyoffice-test）并行的隔离对照实例。
# 不替换 8.1、不共用/不清空其任何数据卷。
# 【已删除（2026-10-31）】升级验证通过、主实例切换 10.0 后，本对照实例的
# 容器与 oo-10_* 卷已按"完成使命即清理"整体删除；本文件保留作为日后
# 隔离试验新版 DS 的配方（重建即用，见下方使用说明）。
#
# 与 8.1/9.0.4 的关键架构差异（必须知道）：
# - 10.0 社区版镜像不再内置 PostgreSQL/RabbitMQ（启动脚本 DB_AVAILABLE=商业版限定），
#   必须外部提供，因此本文件比 8.1 多出 onlyoffice-db-10 / onlyoffice-mq-10 两个服务；
# - 建表 SQL 由镜像提取的 dev/onlyoffice-10/createdb.sql 交给 postgres 容器初始化
#   （社区版跳过 setup_db，不会自己建表）；
# - 字体索引由 10.0 启动尾部自动执行 documentserver-generate-allfonts
#   （GENERATE_FONTS 默认 true），字体目录与 8.1 相同（dev/onlyoffice-fonts/ 只读挂载）。
#
# 隔离手段（与 oo-next 9.0.4 对照实例同思路）：
# - 独立 compose 项目名 oo-10：卷自动落在 oo-10_* 命名空间，与 dev 项目完全隔离；
# - 独立容器名 tdyw-onlyoffice-10 / tdyw-onlyoffice-db-10 / tdyw-onlyoffice-mq-10，
#   网络别名 onlyoffice-10；
# - postgres/rabbitmq 只进内部网络 oo10_internal，不进 dev_default；
# - 仅外部加入既有 dev_default 网络，使 tdyw-test 内 Nginx 能反代 /onlyoffice-10/
#   （见 config/dev/nginx.conf 同名 location）。
#
# 使用：cd dev && docker compose -f docker-compose.onlyoffice-10.yml --env-file .env up -d
# 生命周期：测试实例，restart 默认 no（不随 daemon 常驻）。
# DB/队列连接方式说明：脚本静态阅读显示社区版可能忽略 DB_*/AMQP_URI 环境变量
# （update_db_settings 仅商业版分支调用）；首次启动后必须核对
# /etc/onlyoffice/documentserver/local.json 与 DS 日志，若环境变量未生效，
# 需补挂载 dev/onlyoffice-10/local.json 配置覆盖。
name: oo-10

services:
  onlyoffice-10:
    image: onlyoffice/documentserver:10.0
    container_name: tdyw-onlyoffice-10
    # 入口包装：先放入 DB/队列覆盖配置再交回官方入口（详见 ds-entrypoint.sh 注释）
    entrypoint: ["/bin/bash", "/custom-ds-config/ds-entrypoint.sh"]
    networks:
      dev_default:
        aliases:
          - onlyoffice-10
      oo10_internal: null
    # 仅本机诊断端口（healthcheck/版本核对）；浏览器与业务流量走
    # tdyw-test Nginx 的 /onlyoffice-10/ 反代，不依赖该端口
    ports:
      - "127.0.0.1:8302:80"
    environment:
      # JWT 双向签名：与 8.1 实例同一 secret（dev/.env 注入）
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
      # 与 8.1 相同：放开 DS 出站私网过滤（回调 URL 白名单由 spug 侧负责）
      - USE_UNAUTHORIZED_STORAGE=true
      - TZ=Asia/Shanghai
      # ---- 外部数据库 / 队列（10.0 社区版必须） ----
      # 指向下方 oo10_internal 网络内的 postgres/rabbitmq；凭据为 dev 一次性值
      - DB_TYPE=postgres
      - DB_HOST=onlyoffice-db-10
      - DB_PORT=5432
      - DB_NAME=onlyoffice
      - DB_USER=onlyoffice
      - DB_PWD=onlyoffice
      - AMQP_URI=amqp://oo10:oo10devpass@onlyoffice-mq-10:5672
    volumes:
      # 中文字体：与 8.1 实例完全相同的目录（17 个中英文字体，README 见目录内）
      - ./onlyoffice-fonts:/usr/share/fonts/custom:ro
      # DB/队列配置目录（local.json + 入口包装脚本，只读挂载；不能直接挂
      # local.json 单文件——官方入口 json -I 原地重写会 EBUSY，见 ds-entrypoint.sh）
      - ./onlyoffice-10:/custom-ds-config:ro
      - onlyoffice-logs:/var/log/onlyoffice
      - onlyoffice-data:/var/lib/onlyoffice      # 文档缓存（独立）
    depends_on:
      onlyoffice-db-10:
        condition: service_healthy
      onlyoffice-mq-10:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # DS 10.0 专用外部 PostgreSQL（社区版镜像无内置数据库）
  onlyoffice-db-10:
    image: postgres:16-alpine
    container_name: tdyw-onlyoffice-db-10
    restart: no
    networks:
      oo10_internal: null
    environment:
      - POSTGRES_DB=onlyoffice
      - POSTGRES_USER=onlyoffice
      - POSTGRES_PASSWORD=onlyoffice
    volumes:
      - oo10-postgresql:/var/lib/postgresql/data
      # 首次初始化时建 DS 所需表结构（从 10.0 镜像提取，仅建表；
      # 建库由 POSTGRES_DB 完成）
      - ./onlyoffice-10/createdb.sql:/docker-entrypoint-initdb.d/10-createdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlyoffice -d onlyoffice"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # DS 10.0 专用外部 RabbitMQ（社区版镜像无内置队列）
  # 注意 guest 账号仅限 localhost 登录，必须建独立账号供 DS 远程连接
  onlyoffice-mq-10:
    image: rabbitmq:4-alpine
    container_name: tdyw-onlyoffice-mq-10
    restart: no
    networks:
      oo10_internal: null
    environment:
      - RABBITMQ_DEFAULT_USER=oo10
      - RABBITMQ_DEFAULT_PASS=oo10devpass
    volumes:
      - oo10-rabbitmq:/var/lib/rabbitmq

networks:
  dev_default:
    external: true
  oo10_internal: null

volumes:
  onlyoffice-logs:
  onlyoffice-data:
  oo10-postgresql:
  oo10-rabbitmq:
