# Docker Compose 格式版本 3.3
# 使用方法：docker-compose -f dev/docker-compose.yml up -d


services:
  # 数据库服务（MariaDB）
  db:
    # 使用阿里云镜像仓库的 MariaDB 10.8.2
    image: registry.cn-hangzhou.aliyuncs.com/openspug/mariadb:10.8.2
    # 容器名称
    container_name: tdyw-db-test
    # 容器退出时自动重启
    restart: always
    stop_grace_period: 60s  # InnoDB buffer pool 需要足够时间刷盘，默认 10 秒不够
    # MySQL 配置文件挂载（与生产环境 docker/docker-compose.yml 一致）
    # 由于 Windows Docker 权限问题，挂载到临时位置再由 entrypoint 脚本复制
    volumes:
      - mysql-data:/var/lib/mysql
      - ../docker/config/mysqlnew.cnf:/tmp/mysql-config/custom.cnf:ro
      - ../docker/config/mysql-entrypoint.sh:/usr/local/bin/mysql-custom-entrypoint.sh:ro
    # 使用自定义 entrypoint 处理 Windows 权限问题（与生产一致）
    entrypoint: ["/bin/bash", "/usr/local/bin/mysql-custom-entrypoint.sh"]
    command: ["mysqld"]
    # 端口映射：宿主机 3307 -> 容器 3306
    # 避免与宿主机已有的 MySQL（默认3306端口）冲突
    ports:
      - "3307:3306"
    # MySQL 环境变量配置（从.env文件读取）
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}          # 数据库名称
      - MYSQL_USER=${MYSQL_USER}                  # 普通用户名
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}          # 普通用户密码
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD} # Root 密码
    # 资源限制（与生产环境保持一致）
    deploy:
      resources:
        limits:
          cpus: '2'           # 数据库 CPU 限制
          memory: 8G          # 数据库内存限制：8GB（支持 4G buffer_pool）
        reservations:
          cpus: '0.5'         # 保证至少 0.5 个 CPU 核心
          memory: 2G          # 保证至少 2GB 内存
    # 健康检查：定期检查数据库是否可连接
    # 已优化：放宽检查条件，避免数据库迁移时触发重启
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD not set} || exit 1"]
      interval: 30s      # 从 10s 调整为 30s，降低检查频率
      timeout: 10s       # 从 5s 调整为 10s，容忍更长响应时间
      retries: 8         # 从 5 次增加到 8 次，降低重启触发频率
      start_period: 60s  # 从 30s 调整为 60s，给数据库更多启动时间

  # 主应用服务（Spug）
  spug:
    # 使用本地镜像（含 Celery）
    # 阶段2升级：Django 3.2.25 -> 4.2.30
    image: tdyw:1024
    # 容器名称
    container_name: tdyw-test
    # 特权模式：容器可以访问宿主机所有设备
    # 注意：生产环境不推荐使用 privileged，应移除此配置
    privileged: true
    # 容器退出时自动重启
    restart: always
    # 使用绝对路径的 Bind Mount 映射：将本地目录映射到容器内，便于开发时直接修改代码
    # 开发环境：可以直接在宿主机修改代码，容器内实时生效（热重载）
    # 生产环境：建议改为 Volume 方式
    # volumes:
    #   #入口脚本映射（用于开发时热重载entrypoint）
    #   - E:/TDYW/spug-3.0/docker/config/entrypoint.sh:/entrypoint.sh:ro
    #   # 前端构建产物目录映射（用于生产环境构建后的静态文件）
    #   - E:/TDYW/spug-3.0/spug_web/build:/data/spug/spug_web/build
    #   # 后端代码目录映射（用于开发时热重载）
    #   - E:/TDYW/spug-3.0/spug_api:/data/spug/spug_api
    #   # Development Nginx configuration mapping - 生产环境请使用更安全的配置方式
    #   - E:/TDYW/spug-3.0/config/dev/nginx.conf:/etc/nginx/nginx.conf:ro
    #   # Supervisor配置 - 多文件模式，主配置+子配置分离
    #   - E:/TDYW/spug-3.0/config/dev/supervisor/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:rw
    #   - E:/TDYW/spug-3.0/config/dev/supervisor/conf.d:/etc/supervisor/conf.d:rw
    #   - tdyw-documents:/data/spug/spug_api/storage/documents  # 资料库文件存储
    #   - tdyw-document-chunks:/data/spug/spug_api/storage/document_chunks  # 资料库上传分片存储
    volumes:
        - /mnt/e/TDYW/spug-3.0/docker/config/entrypoint.sh:/entrypoint.sh:ro
        - /mnt/e/TDYW/spug-3.0/spug_web/build:/data/spug/spug_web/build
        - /mnt/e/TDYW/spug-3.0/spug_api:/data/spug/spug_api
        - /mnt/e/TDYW/spug-3.0/config/dev/nginx.conf:/etc/nginx/nginx.conf:ro
        - /mnt/e/TDYW/spug-3.0/config/dev/supervisor/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:rw
        - /mnt/e/TDYW/spug-3.0/config/dev/supervisor/conf.d:/etc/supervisor/conf.d:rw
        # institution .doc->.docx 转换字体（与 onlyoffice 服务共用 dev/onlyoffice-fonts/，
        # 含 sim 全系宋体/仿宋/黑体/楷体等；镜像内另有 fonts-noto-cjk 兜底）。
        # 注意：tdyw:django42-stage2 镜像由容器 commit 固化（原构建配方已失传），
        # 2026-10-29 在容器内补装 libreoffice-writer + fonts-noto-cjk 后 commit——
        # 直接用旧镜像重建容器会同时丢 LibreOffice 与中文字体。
        - /mnt/e/TDYW/spug-3.0/dev/onlyoffice-fonts:/usr/share/fonts/custom:ro
        - tdyw-health-probe-test-logs:/var/log/tdyw:ro

    # 端口映射：宿主机 80 -> 容器 80
    # 开发环境仅使用 HTTP
    ports:
      - "8080:80"
      # 开发环境：暴露后端 API 端口，用于前端开发服务器代理
      - "10001:9001"  # Django API (宿主机10001->容器9001，避开Hyper-V保留)
      - "10002:9002"  # WebSocket (宿主机10002->容器9002，避开Hyper-V保留)
      - "10003:9003"  # 上传专用 API (宿主机10003->容器9003，避开Hyper-V保留)
    # 数据库连接配置（通过环境变量传递给应用）
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}          # 数据库名称
      - MYSQL_USER=${MYSQL_USER}                  # 数据库用户
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}          # 数据库密码
      # 使用服务名 'db' 作为主机名（Docker 内部网络通信）
      # 容器之间通过服务名通信，不需要暴露 MySQL 端口到外网
      - MYSQL_HOST=db
      - MYSQL_PORT=3306              # 容器内 MySQL 端口
      # Django SECRET_KEY - 生产环境应使用随机密钥，避免硬编码
      # 开发环境使用默认值，生产环境请修改为随机字符串
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      # 开发环境：DEBUG模式开启
      - DEBUG=True
      # ALLOWED_HOSTS: 允许的 Host 头
      # 必须包含容器名 tdyw-test，否则 kkFileView 回访 spug 时
      # Host: tdyw-test 会被 Django 拒绝（DisallowedHost → 400）
      - ALLOWED_HOSTS=127.0.0.1,localhost,tdyw-test
      # kkFileView 配置 - Office文档在线预览
      # KKFILEVIEW_API_URL: 前端浏览器访问kkFileView的地址（通过Nginx代理）
      # KKFILEVIEW_SERVER_URL: kkFileView容器回访spug API下载文件的地址
      #   开发环境默认用容器名 tdyw-test（docker-compose 网络 DNS 可解析）
      - KKFILEVIEW_API_URL=${KKFILEVIEW_API_URL:-/kkfileview}
      - KKFILEVIEW_SERVER_URL=${KKFILEVIEW_SERVER_URL:-http://tdyw-test}
      # ONLYOFFICE Docs 在线编辑（制度管理，2026-10-28 dev 联调）
      # ONLYOFFICE_DOCS_URL: 浏览器经 tdyw-test 内 Nginx 同源子路径代理访问 DS
      # ONLYOFFICE_PUBLIC_BASE_URL: DS 容器回访 spug API 的基址（Compose 网络
      #   内 DNS 直连容器名，nginx 在容器内 80 端口）
      # ONLYOFFICE_JWT_SECRET: 与 onlyoffice 服务的 JWT_SECRET 同源（dev/.env，
      #   未跟踪文件）；留空时后端 editor_available=false 整体降级为 multipart
      #   本机编辑路径，不会导致应用启动失败
      # ONLYOFFICE_ALLOWED_URL_HOSTS: 回调文件下载主机名白名单（DS 缓存 URL
      #   以 http://localhost:8080/onlyoffice/cache/... 生成，经 tdyw-test
      #   自身 Nginx 回到 DS，见 config/dev/nginx.conf 注释；PUBLIC_BASE_URL
      #   的主机名 tdyw-test 由后端自动并入）
      - ONLYOFFICE_DOCS_URL=${ONLYOFFICE_DOCS_URL:-/onlyoffice}
      - ONLYOFFICE_PUBLIC_BASE_URL=${ONLYOFFICE_PUBLIC_BASE_URL:-http://tdyw-test}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - ONLYOFFICE_ALLOWED_URL_HOSTS=${ONLYOFFICE_ALLOWED_URL_HOSTS:-localhost,onlyoffice}
      - ONLYOFFICE_EDITOR_TOKEN_TTL_SECONDS=${ONLYOFFICE_EDITOR_TOKEN_TTL_SECONDS:-3600}
    # 依赖关系：spug 服务依赖 db 服务，确保数据库健康后才启动
    depends_on:
      db:
        condition: service_healthy
    # 资源限制（与生产环境保持一致）
    deploy:
      resources:
        limits:
          cpus: '4'           # 主应用服务 CPU 限制（MD5计算、文件处理需较多CPU）
          memory: 4G          # 主应用服务内存限制（资料库、运行日志、Celery需较大内存）
        reservations:
          cpus: '1'           # 保证至少 1 个 CPU 核心
          memory: 1G          # 保证至少 1GB 内存
    # 【gevent优化】文件描述符限制，支持高并发连接
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # 健康检查：检查Web服务是否可访问
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 独立于主应用的外部探活，结果通过共享卷交给 tdyw-test 聚合。
  health-probe:
    image: tdyw:django42-stage2
    container_name: tdyw-health-probe-test
    restart: always
    entrypoint: ["python", "/opt/health_probe.py"]
    environment:
      - HEALTH_PROBE_URL=${HEALTH_PROBE_URL:-http://tdyw-test/api/document/health/}
      - HEALTH_PROBE_LOG=/var/log/tdyw/health-probe.jsonl
      - HEALTH_PROBE_INTERVAL=${HEALTH_PROBE_INTERVAL:-60}
    volumes:
      - /mnt/e/TDYW/spug-3.0/docker/scripts/health_probe.py:/opt/health_probe.py:ro
      - tdyw-health-probe-test-logs:/var/log/tdyw
    depends_on:
      spug:
        condition: service_started
    healthcheck:
      test: ["CMD", "sh", "-c", "find /var/log/tdyw/health-probe.jsonl -mmin -3 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ==================== kkFileView 文件预览服务 ====================
  # Office文档在线预览服务（支持 doc/docx/xls/xlsx/ppt/pptx 等 80+ 格式）
  # 部署文档：https://github.com/kekingcn/kkFileView
  kkfileview:
    image: keking/kkfileview:4.1.0
    container_name: tdyw-kkfileview-test
    restart: always
    ports:
      - "8012:8012"
    environment:
      - KK_CONTEXT_PATH=/kkfileview        # 上下文路径，与Nginx代理路径1:1映射
      - KK_OFFICE_PREVIEW_TYPE=image       # Office预览方式：image(图片模式，性能好) 或 pdf
      - KK_CACHE_ENABLED=true              # 启用缓存，避免重复转换
      - KK_FILE_UPLOAD_ENABLED=false       # 禁止通过kkFileView上传文件（安全）
      - KK_HISTORY_FILE_CLEAN_ENABLED=true  # 启用历史文件清理
      - KK_HISTORY_FILE_CLEAN_CYCLE=720    # 清理周期（分钟），12小时
      - KK_BASE_URL=${KKFILEVIEW_BASE_URL:-http://localhost/kkfileview}  # 浏览器访问kkFileView的外部地址，否则PDF预览会指向127.0.0.1
      - TZ=Asia/Shanghai
    volumes:
      - kkfileview-cache:/opt/kkFileView-4.1.0/file  # 预览缓存持久化（路径与版本相关，升级时注意修改）
    deploy:
      resources:
        limits:
          cpus: '2'           # LibreOffice转换需要较多CPU
          memory: 4G          # Office转换需要较大内存（大docx含图片需4G+）
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8012/kkfileview/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s     # LibreOffice首次启动较慢，给2分钟

  # ==================== ONLYOFFICE Docs 文档服务 ====================
  # 制度管理 Word 手册在线编辑（2026-10-28 dev 联调）
  # 2026-10-30 主实例升级 8.1 -> 10.0（经 oo-10 隔离对照实例全链路验证通过）：
  # - 10.0 社区版不再内置 PostgreSQL/RabbitMQ，新增 onlyoffice-db/onlyoffice-mq
  #   两个外部服务；数据全部落在 *-10 新卷。2026-10-31 起应用层（后端
  #   editor_services forcesave 仅 /command 直连）不再兼容 8.1，回退到 8.1 需
  #   连同后端代码一起回退并补跑 documentserver-generate-allfonts.sh；8.1 旧
  #   数据卷（onlyoffice-postgresql/rabbitmq/data/logs）已不在本文件声明，
  #   卷数据仍保留在 docker 卷存储中作数据保险，未经确认绝不手动删除。
  # - 入口包装与 local.json 见 dev/onlyoffice-main/（10.0 社区版忽略 DB_*/AMQP_URI
  #   环境变量，且 local.json 不可直接 bind-mount，见 ds-entrypoint.sh 注释）。
  # - 中文字体仍挂载 dev/onlyoffice-fonts/（与 8.1 同目录）；10.0 启动时自动
  #   重建字体索引（GENERATE_FONTS 默认 true）。
  # 不映射宿主机端口：浏览器经 tdyw-test 内 Nginx /onlyoffice/ 子路径代理访问，
  # spug 容器经 PUBLIC_BASE_URL=http://tdyw-test 回源通道与 DS 互通。
  onlyoffice:
    image: onlyoffice/documentserver:10.0
    container_name: tdyw-onlyoffice-test
    restart: always
    # 入口包装：先放入 DB/队列覆盖配置再交回官方入口（详见
    # dev/onlyoffice-main/ds-entrypoint.sh 注释）
    entrypoint: ["/bin/bash", "/custom-ds-config/ds-entrypoint.sh"]
    depends_on:
      onlyoffice-db:
        condition: service_healthy
      onlyoffice-mq:
        condition: service_started
    environment:
      # JWT 双向签名：与 spug 的 ONLYOFFICE_JWT_SECRET 必须一致（dev/.env 注入）
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
      # 10.0 中该变量仅保留 rejectUnauthorized=false 语义；私网回源由
      # JWT 签名 URL 绕过过滤兜底（directIfIn.jwtToken 默认 true，已实测）
      - USE_UNAUTHORIZED_STORAGE=true
      - TZ=Asia/Shanghai
    volumes:
      - onlyoffice-logs-10:/var/log/onlyoffice
      - onlyoffice-data-10:/var/lib/onlyoffice   # 文档缓存（10.0 新卷）
      # 中文字体补充（与 8.1 同一目录，17 个中英文字体；增删字体后须执行
      #   docker exec tdyw-onlyoffice-test documentserver-generate-allfonts.sh
      # 10.0 启动时也会自动重建索引）
      - ./onlyoffice-fonts:/usr/share/fonts/custom:ro
      # DB/队列配置目录（local.json + 入口包装，只读；不能直接挂 local.json
      # 单文件——官方入口 json -I 原地重写会 EBUSY）
      - ./onlyoffice-main:/custom-ds-config:ro
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ONLYOFFICE 10.0 专用外部 PostgreSQL（社区版镜像无内置数据库；
  # 表结构由 dev/onlyoffice-main/createdb.sql 首次初始化）
  onlyoffice-db:
    image: postgres:16-alpine
    container_name: tdyw-onlyoffice-db
    restart: always
    environment:
      - POSTGRES_DB=onlyoffice
      - POSTGRES_USER=onlyoffice
      - POSTGRES_PASSWORD=onlyoffice
    volumes:
      - onlyoffice-postgresql-10:/var/lib/postgresql/data
      - ./onlyoffice-main/createdb.sql:/docker-entrypoint-initdb.d/10-createdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlyoffice -d onlyoffice"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ONLYOFFICE 10.0 专用外部 RabbitMQ（guest 仅限 localhost，用独立账号）
  onlyoffice-mq:
    image: rabbitmq:4-alpine
    container_name: tdyw-onlyoffice-mq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=oomain
      - RABBITMQ_DEFAULT_PASS=oomaindevpass
    volumes:
      - onlyoffice-rabbitmq-10:/var/lib/rabbitmq

# 注意事项：
# 1. 当前配置使用绝对路径，适用于 Windows 开发环境
# 2. 部署到 Linux 生产环境时需要：
#    - 将 Windows 路径改为 Linux 绝对路径（如 /opt/spug-3.0/data/mysql）
#    - 考虑使用 Volume 替代 Bind Mount 以提升性能和安全性
#    - 移除 privileged: true
#    - 使用更安全的密码管理方式（环境变量或 secrets）
# 3. 生产环境建议关闭 MySQL 端口的宿主机映射（ports: 3307:3306）
#    仅在 Docker 内部网络通信，增强安全性

# Volume 定义
volumes:
  mysql-data:
    driver: local
  kkfileview-cache:
    driver: local
  tdyw-health-probe-test-logs:
    driver: local
  # ---- 8.1 时代旧卷不在本文件声明（2026-10-31 清理）----
  # onlyoffice-logs/data/postgresql/rabbitmq 四个 8.1 卷的数据仍保留在
  # docker 卷存储中（dev_onlyoffice-* 前缀）作数据保险；应用层已不兼容 8.1，
  # 回退需连同后端代码一起回退。未经确认绝不手动删除卷数据。
  # ---- ONLYOFFICE 10.0 主实例新卷（2026-10-30） ----
  onlyoffice-logs-10:
    driver: local
  onlyoffice-data-10:
    driver: local
  onlyoffice-postgresql-10:
    driver: local
  onlyoffice-rabbitmq-10:
    driver: local
