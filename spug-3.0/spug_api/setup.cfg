[flake8]
# 【任务5.1】Flake8 配置 - 后端代码检查工具
# 配置强制规则，确保代码质量

# ==================== 文件和行数限制 ====================
# 每行最大字符数
max-line-length = 120

# 文件最大行数（代码检查报告要求 ≤1000行）
max-doc-length = 1000

# 函数最大行数（代码检查报告要求 ≤200行）
# 通过 extend-immutable-calls 和其他方式控制

# ==================== 复杂度限制 ====================
# McCabe 复杂度阈值
max-complexity = 15

# ==================== 忽略的规则 ====================
# E203: whitespace before ':'（与 black 冲突）
# E501: line too long（我们使用 max-line-length）
# W503: line break before binary operator（与 black 冲突）
# E402: module level import not at top of file（Django 项目常见）
ignore = E203,W503,E402

# ==================== 排除的目录 ====================
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    env,
    .env,
    migrations,
    media,
    static,
    logs,
    tests/*,
    */tests/*,
    */migrations/*

# ==================== 额外启用的规则 ====================
# F: Pyflakes (变量检查)
# E,W: pycodestyle (代码风格)
# C: McCabe (复杂度)
select = E,W,F,C

# ==================== 特定文件配置 ====================
per-file-ignores =
    # settings 文件允许导入位置灵活
    */settings*.py:E402
    # urls 文件允许行较长
    */urls.py:E501
    # manage.py 允许导入位置灵活
    manage.py:E402
    # __init__.py 允许未使用导入
    */__init__.py:F401

# ==================== 错误输出格式 ====================
format = %(path)s:%(row)d:%(col)d: %(code)s %(text)s

# ==================== 显示统计 ====================
show-source = true
statistics = true
