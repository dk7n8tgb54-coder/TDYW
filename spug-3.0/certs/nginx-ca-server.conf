# Nginx Configuration for Serving CA Certificate Installation Page
# Add this to your main nginx.conf or create a separate server block

server {
    listen 80;
    server_name spug.internal;

    root /opt/spug-3.0/certs;
    index install-ca.html;

    # Serve the installation page
    location /install-ca.html {
        try_files $uri $uri/ =404;
    }

    # Serve the CA certificate with correct content type
    location /ca.crt {
        types {
            application/x-x509-ca-cert crt;
        }
        default_type application/x-x509-ca-cert;
        add_header Content-Type application/x-x509-ca-cert always;
        add_header Content-Disposition "attachment; filename=spug-ca.crt" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Optional: Redirect HTTP to HTTPS
    # return 301 https://$server_name$request_uri;
}
