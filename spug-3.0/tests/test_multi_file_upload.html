<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多文件并发上传测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 30px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .config-section {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .config-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 15px;
      font-size: 16px;
    }

    .config-row {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .config-row label {
      width: 150px;
      color: #555;
      font-size: 14px;
    }

    .config-row input {
      flex: 1;
      max-width: 200px;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    .config-row input:focus {
      outline: none;
      border-color: #667eea;
    }

    .config-row span {
      margin-left: 8px;
      color: #999;
      font-size: 12px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #d0d0d0;
    }

    .btn-danger {
      background: #ff4d4f;
      color: white;
    }

    .btn-danger:hover:not(:disabled) {
      background: #ff7875;
    }

    .test-section {
      margin-top: 20px;
    }

    .test-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .test-title {
      font-weight: 600;
      color: #333;
      font-size: 16px;
    }

    .test-status {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }

    .status-waiting {
      background: #e0e0e0;
      color: #666;
    }

    .status-running {
      background: #e3f2fd;
      color: #1976d2;
    }

    .status-success {
      background: #e8f5e9;
      color: #388e3c;
    }

    .status-failed {
      background: #ffebee;
      color: #d32f2f;
    }

    .console {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 6px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      height: 400px;
      overflow-y: auto;
      margin-bottom: 20px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .console .log {
      margin-bottom: 5px;
    }

    .console .success {
      color: #4caf50;
    }

    .console .error {
      color: #f44336;
    }

    .console .warning {
      color: #ff9800;
    }

    .console .info {
      color: #2196f3;
    }

    .results-section {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .result-card {
      background: white;
      border-radius: 6px;
      padding: 15px;
      border-left: 4px solid #ddd;
    }

    .result-card.passed {
      border-left-color: #4caf50;
    }

    .result-card.failed {
      border-left-color: #f44336;
    }

    .result-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .result-message {
      color: #666;
      font-size: 12px;
      word-break: break-all;
    }

    .summary {
      display: flex;
      gap: 30px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
    }

    .summary-label {
      color: #666;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .summary-value {
      font-size: 24px;
      font-weight: 600;
      color: #333;
    }

    .summary-value.passed {
      color: #4caf50;
    }

    .summary-value.failed {
      color: #f44336;
    }

    .progress-bar {
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transition: width 0.3s;
      width: 0%;
    }

    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }

      .config-row {
        flex-direction: column;
        align-items: flex-start;
      }

      .config-row label {
        width: 100%;
        margin-bottom: 5px;
      }

      .config-row input {
        width: 100%;
        max-width: none;
      }

      .button-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 多文件并发上传测试工具</h1>
    <p class="subtitle">基于多文件并发上传实现说明.md 的自动化测试工具</p>

    <!-- 测试配置 -->
    <div class="config-section">
      <div class="config-title">📋 测试配置</div>
      <div class="config-row">
        <label>文件数量</label>
        <input type="number" id="fileCount" value="5" min="1" max="20">
        <span>个</span>
      </div>
      <div class="config-row">
        <label>文件大小</label>
        <input type="number" id="fileSize" value="5" min="1" max="50">
        <span>MB</span>
      </div>
      <div class="config-row">
        <label>预期并发数</label>
        <input type="number" id="expectedConcurrency" value="3" min="1" max="10">
        <span>个</span>
      </div>
      <div class="config-row">
        <label>超时时间</label>
        <input type="number" id="timeout" value="30" min="10" max="120">
        <span>秒</span>
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="button-group">
      <button class="btn-primary" id="runTest" onclick="runTests()">▶️ 运行测试</button>
      <button class="btn-secondary" id="clearConsole" onclick="clearConsole()">🗑️ 清空控制台</button>
      <button class="btn-danger" id="stopTest" onclick="stopTests()" disabled>⏹️ 停止测试</button>
    </div>

    <!-- 进度条 -->
    <div class="progress-bar">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>

    <!-- 测试控制台 -->
    <div class="test-section">
      <div class="test-header">
        <div class="test-title">📝 测试日志</div>
        <span class="test-status status-waiting" id="testStatus">等待运行</span>
      </div>
      <div class="console" id="console"></div>
    </div>

    <!-- 测试结果 -->
    <div class="results-section" id="resultsSection" style="display: none;">
      <div class="test-title">📊 测试结果</div>
      <div class="results-grid" id="resultsGrid"></div>
      <div class="summary">
        <div class="summary-item">
          <span class="summary-label">总计</span>
          <span class="summary-value" id="summaryTotal">0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">通过</span>
          <span class="summary-value passed" id="summaryPassed">0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">失败</span>
          <span class="summary-value failed" id="summaryFailed">0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">耗时</span>
          <span class="summary-value" id="summaryDuration">0s</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 加载测试脚本 -->
  <script src="../tests/test_multi_file_upload.js"></script>

  <script>
    // 测试状态
    let isRunning = false;
    let tester = null;
    let testResults = [];
    let startTime = null;

    /**
     * 控制台日志输出
     */
    function log(message, type = 'log') {
      const console = document.getElementById('console');
      const line = document.createElement('div');
      line.className = `log ${type}`;
      line.textContent = message;
      console.appendChild(line);
      console.scrollTop = console.scrollHeight;
    }

    /**
     * 清空控制台
     */
    function clearConsole() {
      document.getElementById('console').innerHTML = '';
    }

    /**
     * 更新测试状态
     */
    function updateTestStatus(status) {
      const statusEl = document.getElementById('testStatus');
      statusEl.className = `test-status status-${status}`;

      const statusMap = {
        'waiting': '等待运行',
        'running': '测试中...',
        'success': '测试完成',
        'failed': '测试失败'
      };
      statusEl.textContent = statusMap[status] || status;
    }

    /**
     * 更新进度条
     */
    function updateProgress(percent) {
      document.getElementById('progressBar').style.width = `${percent}%`;
    }

    /**
     * 显示测试结果
     */
    function showResults(results) {
      const resultsSection = document.getElementById('resultsSection');
      const resultsGrid = document.getElementById('resultsGrid');
      resultsSection.style.display = 'block';
      resultsGrid.innerHTML = '';

      results.forEach((result, index) => {
        const card = document.createElement('div');
        card.className = `result-card ${result.passed ? 'passed' : 'failed'}`;
        card.innerHTML = `
          <div class="result-name">${result.passed ? '✅' : '❌'} ${index + 1}. ${result.name}</div>
          <div class="result-message">${result.message || '测试通过'}</div>
        `;
        resultsGrid.appendChild(card);
      });

      // 更新摘要
      const passed = results.filter(r => r.passed).length;
      const failed = results.filter(r => !r.passed).length;
      const duration = startTime ? Math.round((Date.now() - startTime) / 1000) : 0;

      document.getElementById('summaryTotal').textContent = results.length;
      document.getElementById('summaryPassed').textContent = passed;
      document.getElementById('summaryFailed').textContent = failed;
      document.getElementById('summaryDuration').textContent = `${duration}s`;
    }

    /**
     * 运行测试
     */
    async function runTests() {
      if (isRunning) return;

      // 获取配置
      const config = {
        fileCount: parseInt(document.getElementById('fileCount').value) || 5,
        fileSize: parseInt(document.getElementById('fileSize').value) || 5,
        expectedConcurrency: parseInt(document.getElementById('expectedConcurrency').value) || 3,
        timeout: parseInt(document.getElementById('timeout').value) * 1000 || 30000
      };

      // 更新全局配置
      if (typeof TEST_CONFIG !== 'undefined') {
        TEST_CONFIG.fileCount = config.fileCount;
        TEST_CONFIG.fileSize = config.fileSize;
        TEST_CONFIG.expectedConcurrency = config.expectedConcurrency;
        TEST_CONFIG.timeout = config.timeout;
        TEST_CONFIG.checkInterval = 500;
      }

      // 检查是否在正确的页面
      if (!window.documentStore) {
        log('❌ 错误：找不到 documentStore', 'error');
        log('请确保在 Spug 文档管理页面运行此测试工具', 'warning');
        return;
      }

      // 更新 UI
      isRunning = true;
      startTime = Date.now();
      document.getElementById('runTest').disabled = true;
      document.getElementById('stopTest').disabled = false;
      document.getElementById('resultsSection').style.display = 'none';
      clearConsole();
      updateTestStatus('running');
      updateProgress(10);

      log('===================================================', 'info');
      log('      多文件并发上传功能测试开始', 'info');
      log('===================================================', 'info');
      log(`测试配置:`, 'info');
      log(`  - 文件数量: ${config.fileCount}`, 'info');
      log(`  - 文件大小: ${config.fileSize}MB`, 'info');
      log(`  - 预期并发: ${config.expectedConcurrency}`, 'info');
      log(`  - 超时时间: ${config.timeout / 1000}秒`, 'info');
      log('===================================================\n', 'info');

      // 创建测试实例
      tester = new UploadTester();

      // 拦截 recordResult 方法以显示进度
      const originalRecordResult = tester.recordResult.bind(tester);
      const totalTests = 5;
      let currentTest = 0;

      tester.recordResult = function(name, passed, message) {
        const icon = passed ? '✅' : '❌';
        log(`${icon} ${name}${message ? ': ' + message : ''}`, passed ? 'success' : 'error');
        originalRecordResult(name, passed, message);

        // 更新进度
        currentTest++;
        const progress = 10 + (currentTest / totalTests) * 80;
        updateProgress(progress);
      };

      try {
        // 运行测试
        await tester.runAll();
        updateTestStatus('success');
        updateProgress(100);

        // 显示结果
        setTimeout(() => {
          showResults(tester.results);
        }, 500);

      } catch (error) {
        log(`\n❌ 测试过程中发生错误: ${error.message}`, 'error');
        updateTestStatus('failed');
        showResults(tester.results);
      } finally {
        isRunning = false;
        document.getElementById('runTest').disabled = false;
        document.getElementById('stopTest').disabled = true;
      }
    }

    /**
     * 停止测试
     */
    function stopTests() {
      if (!isRunning) return;

      log('\n⚠️ 正在停止测试...', 'warning');

      // 取消所有上传
      if (window.documentStore && window.documentStore.cancelAll) {
        window.documentStore.cancelAll();
      }

      isRunning = false;
      document.getElementById('runTest').disabled = false;
      document.getElementById('stopTest').disabled = true;
      updateTestStatus('failed');
      log('❌ 测试已停止', 'error');
    }

    // 页面加载完成后的提示
    window.addEventListener('load', () => {
      log('📋 多文件并发上传测试工具已就绪', 'info');
      log('请配置测试参数后点击 "运行测试" 开始测试\n', 'info');

      if (!window.documentStore) {
        log('⚠️ 警告：当前页面找不到 documentStore', 'warning');
        log('请在 Spug 文档管理页面运行此测试工具', 'warning');
      }
    });
  </script>
</body>
</html>
